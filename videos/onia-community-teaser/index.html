<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;900&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #00C661; }
      body { font-family: "Inter", sans-serif; }
      .clip {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        gap: 48px; padding: 90px;
      }
      .pill {
        background: #0A0A0A; color: #00C661; font-weight: 900; font-size: 44px;
        padding: 24px 56px; border-radius: 60px; letter-spacing: 0.02em;
      }
      .big { font-size: 118px; font-weight: 900; color: #0A0A0A; letter-spacing: -0.04em; line-height: 1.02; text-align: center; }
      .big .w { display: inline-block; white-space: pre; }
      .linea { font-size: 92px; font-weight: 900; color: #0A0A0A; letter-spacing: -0.03em; text-align: center; }
      .linea.blanca { color: #FFFFFF; }
      .sub { font-size: 46px; font-weight: 600; color: rgba(0,0,0,.62); text-align: center; line-height: 1.3; }
      .wordmark { font-size: 168px; font-weight: 900; color: #0A0A0A; letter-spacing: -0.05em; line-height: 0.95; text-align: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920">

      <!-- E1: 0 - 4.2 -->
      <div id="e1" class="clip" data-start="0" data-duration="4.2" data-track-index="1">
        <div class="pill" id="e1-pill">CADA DÍA</div>
        <div class="big" id="e1-t">
          <span class="w">Un </span><span class="w">recurso </span><span class="w">de </span><span class="w">IA</span><br/>
          <span class="w">que </span><span class="w">uso </span><span class="w">de </span><span class="w">verdad</span>
        </div>
        <div class="sub" id="e1-s">para construir mi empresa</div>
      </div>

      <!-- E2: 4.2 - 8.4 -->
      <div id="e2" class="clip" data-start="4.2" data-duration="4.2" data-track-index="1">
        <div class="linea" id="e2-a">Herramientas.</div>
        <div class="linea blanca" id="e2-b">Prompts.</div>
        <div class="linea" id="e2-c">Automatizaciones.</div>
        <div class="sub" id="e2-s">con 16 años, desde Bolivia 🇧🇴</div>
      </div>

      <!-- E3: 8.4 - 12 -->
      <div id="e3" class="clip" data-start="8.4" data-duration="3.6" data-track-index="1">
        <div class="wordmark" id="e3-w">Onia<br/>Community</div>
        <div class="pill" id="e3-p" style="font-size: 52px;">COMENTÁ: COMUNIDAD</div>
      </div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ===== E1 (0 - 4.2) — waterfall entry, staged reveals ===== */
      gsap.set("#e1-pill", { autoAlpha: 0 });
      gsap.set("#e1 .w", { autoAlpha: 0 });
      gsap.set("#e1-s", { autoAlpha: 0 });
      tl.to("#e1-pill", { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out", startAt: { y: -60 } }, 0.0);
      tl.to("#e1 .w", {
        autoAlpha: 1, y: 0, duration: 0.55, ease: "power3.out",
        startAt: { y: 70 }, stagger: 0.07
      }, 0.35);
      tl.to("#e1-s", { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out", startAt: { y: 40 } }, 1.6);
      /* exit LEFT, accelerating, cut mid-motion at 4.2 */
      tl.to("#e1", { x: -1080, duration: 0.9, ease: "power4.in" }, 3.5);

      /* ===== E2 (4.2 - 8.4) — enters LEFT mid-flight (matched vector) ===== */
      gsap.set("#e2", { x: 540, autoAlpha: 1 });
      gsap.set(["#e2-a", "#e2-b", "#e2-c", "#e2-s"], { autoAlpha: 0 });
      tl.to("#e2", { x: 0, duration: 0.55, ease: "power4.out" }, 4.2);
      tl.to("#e2-a", { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out", startAt: { x: 160 } }, 4.25);
      tl.to("#e2-b", { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out", startAt: { x: 160 } }, 4.75);
      tl.to("#e2-c", { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out", startAt: { x: 160 } }, 5.25);
      tl.to("#e2-s", { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out", startAt: { y: 40 } }, 6.1);
      /* exit LEFT mid-motion at 8.4 */
      tl.to("#e2", { x: -1080, duration: 0.9, ease: "power4.in" }, 7.7);

      /* ===== E3 (8.4 - 12) — enters LEFT mid-flight, then causal pop ===== */
      gsap.set("#e3", { x: 540, autoAlpha: 1 });
      gsap.set("#e3-w", { autoAlpha: 1 });
      gsap.set("#e3-p", { autoAlpha: 0, scale: 0.6 });
      tl.to("#e3", { x: 0, duration: 0.55, ease: "power4.out" }, 8.4);
      /* stillness before climax (0.45s), then the pill pops — caused by the landing */
      tl.to("#e3-p", { autoAlpha: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 9.4);
      /* wordmark subtle settle continues the arrival (no idle wobble: single settle, then hold on composed frame) */
      tl.fromTo("#e3-w", { y: 24 }, { y: 0, duration: 0.6, ease: "power2.out" }, 8.5);

      tl.seek(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
