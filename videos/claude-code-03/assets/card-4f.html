<!doctype html>
<meta charset="utf-8">
<!-- Card estilo lamina 05 de la referencia: numero-badge + titulo + flechas naranjas. -->
<style>
@font-face{font-family:'Inter';src:url('fonts/Inter-var-latin.woff2')format('woff2');font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;overflow:hidden}
#stage{width:780px;padding:10px}
.card{background:#F5F1E8;border-radius:18px;padding:44px 52px 48px;
      box-shadow:0 20px 44px rgba(0,0,0,.24);font-family:'Inter',sans-serif;color:#1D1D1F}
.badge{display:inline-block;background:#EDE7D8;border-radius:999px;padding:10px 24px;
       font-weight:700;font-size:30px;color:#6E6E73}
h1{font-weight:800;font-size:74px;letter-spacing:-0.03em;margin-top:18px}
.linea{height:5px;width:110px;background:#FF6A2B;border-radius:3px;margin:16px 0 26px}
.item{display:flex;align-items:center;gap:20px;font-size:40px;font-weight:600;margin-top:16px}
.item .fl{color:#FF6A2B;font-weight:800}
</style>
<div id="stage"><div class="card">
  <div class="badge">4 funciones</div>
  <h1>Que trabaje solo</h1>
  <div class="linea"></div>
  <div class="item"><span class="fl">&#8594;</span> Hooks</div>
  <div class="item"><span class="fl">&#8594;</span> Subagentes</div>
  <div class="item"><span class="fl">&#8594;</span> Conectores</div>
  <div class="item"><span class="fl">&#8594;</span> Horarios</div>
</div></div>
