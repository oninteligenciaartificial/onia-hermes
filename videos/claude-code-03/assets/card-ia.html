<!doctype html>
<meta charset="utf-8">
<!-- Los logos REALES: tile de Claude + wordmark de Anthropic sobre card crema. -->
<style>
@font-face{font-family:'Inter';src:url('fonts/Inter-var-latin.woff2')format('woff2');font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;overflow:hidden}
#stage{width:720px;padding:10px}
.card{background:#F5F1E8;border-radius:18px;padding:44px 48px;
      box-shadow:0 20px 44px rgba(0,0,0,.24);font-family:'Inter',sans-serif;
      display:flex;flex-direction:column;align-items:center;gap:30px}
.tile{width:170px;height:170px;border-radius:23%;overflow:hidden;
      box-shadow:0 14px 30px rgba(0,0,0,.16)}
.tile img{width:100%;height:100%;display:block}
.word{width:430px}
.word img{width:100%;display:block}
</style>
<div id="stage"><div class="card">
  <div class="tile"><img src="claude.png"></div>
  <div class="word"><img src="anthropic-wordmark.png"></div>
</div></div>
