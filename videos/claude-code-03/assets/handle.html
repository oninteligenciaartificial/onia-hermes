     (asi respeta las bandas negras de los lados); esto repone lo unico que esa tapa

     en ventana el handle cae en otra posicion y aca quedaria descolocado. -->

.handle{position:absolute;left:112px;bottom:75px;
        font-family:'Spline Sans Mono',monospace;font-size:20px;font-weight:500;
        letter-spacing:.1em;color:#6E6E73;line-height:1}
</style>
