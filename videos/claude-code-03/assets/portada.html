<!doctype html>
<meta charset="utf-8">
<!-- Titular de portada estilo STOP-AI-SLOP: display crema mezcla romana/italica,
     kicker arriba, byline abajo. Full-frame 1920x1080 con alpha. -->
<style>
@font-face{font-family:'Instrument Serif';src:url('fonts/InstrumentSerif-latin.woff2')format('woff2')}
@font-face{font-family:'Inter';src:url('fonts/Inter-var-latin.woff2')format('woff2');font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;background:transparent;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;font-family:'Inter',sans-serif}
.kicker{position:absolute;top:44px;left:0;right:0;text-align:center;color:#F5F1E8;
        font-weight:800;font-size:30px;letter-spacing:.32em;
        text-shadow:0 2px 14px rgba(0,0,0,.55)}
.titulo{position:absolute;left:70px;bottom:96px;color:#F5F1E8;line-height:.96;
        text-shadow:0 6px 30px rgba(0,0,0,.55)}
.titulo .a{font-weight:800;font-size:132px;letter-spacing:-0.03em}
.titulo .b{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;
           font-size:148px;letter-spacing:-0.01em}
.pie{display:flex;justify-content:space-between;align-items:baseline;width:1772px;
     margin-top:30px;color:#F5F1E8;text-shadow:0 2px 14px rgba(0,0,0,.55)}
.pie .baja{font-weight:700;font-size:34px}
.pie .byline{font-weight:600;font-size:26px;letter-spacing:.22em}
</style>
<div id="stage">
  <div class="kicker">SERIE CLAUDE CODE &middot; 03</div>
  <div class="titulo"><span class="a">Que trabaje</span><br><span class="b">sin vos.</span>
    <div class="pie"><span class="baja">4 funciones para que corra solo.</span><span class="byline">@sergiourcullo</span></div>
  </div>
</div>
