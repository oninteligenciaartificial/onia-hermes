<!doctype html>

<style>
@font-face{font-family:'Inter';src:url('fonts/Inter-var-latin.woff2')format('woff2');font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;overflow:hidden}
#stage{width:1000px;padding:24px;text-align:center}
.kw{display:inline-block;color:#fff;font-family:'Inter',sans-serif;font-weight:900;
