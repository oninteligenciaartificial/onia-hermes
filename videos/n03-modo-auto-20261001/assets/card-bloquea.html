<!doctype html>
<meta charset="utf-8">
<!-- Tarjeta dark estilo dashboard (calco del reel de Codex): barra mac + kicker,
     titulo grande, lineas mono. Tokens: POR DEFECTO · BLOQUEA Lo <span class="ac">peligroso</span> <span style="color:#FF5C5C;font-weight:700">✗</span> bajar y ejecutar código (curl | bash) <span style="color:#FF5C5C;font-weight:700">✗</span> deploys a producción <span style="color:#FF5C5C;font-weight:700">✗</span> force push · borrar · reset --hard #FF6A2B -->
<style>
@font-face{font-family:'Inter';src:url('fonts/Inter-var-latin.woff2')format('woff2');font-weight:100 900}
@font-face{font-family:'Spline Sans Mono';src:url('fonts/SplineSansMono-var-latin.woff2')format('woff2');font-weight:300 700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;overflow:hidden}
#stage{width:840px;padding:12px}
.card{background:#12151C;border:1px solid rgba(255,255,255,.08);border-radius:20px;
      box-shadow:0 24px 50px rgba(0,0,0,.45);overflow:hidden;font-family:'Inter',sans-serif}
.barra{display:flex;align-items:center;gap:9px;padding:16px 20px;
       border-bottom:1px solid rgba(255,255,255,.08)}
.barra i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.22)}
.barra span{font-family:'Spline Sans Mono',monospace;color:#8A8F98;font-size:24px;
            letter-spacing:.18em;margin-left:8px}
.cuerpo{padding:26px 30px 30px}
h1{color:#F2F3F5;font-weight:800;font-size:52px;letter-spacing:-0.02em;line-height:1.05}
h1 .ac{color:#FF6A2B}
.linea{font-family:'Spline Sans Mono',monospace;font-size:30px;color:#C9CDD4;
       margin-top:18px;display:flex;gap:14px;align-items:baseline}
.linea:first-of-type{margin-top:24px}
.linea .tick{color:#00D26A;font-weight:700}
.linea:empty{display:none}
</style>
<div id="stage"><div class="card">
  <div class="barra"><i></i><i></i><i></i><span>POR DEFECTO · BLOQUEA</span></div>
  <div class="cuerpo">
    <h1>Lo <span class="ac">peligroso</span></h1>
    <div class="linea"><span style="color:#FF5C5C;font-weight:700">✗</span> bajar y ejecutar código (curl | bash)</div>
    <div class="linea"><span style="color:#FF5C5C;font-weight:700">✗</span> deploys a producción</div>
    <div class="linea"><span style="color:#FF5C5C;font-weight:700">✗</span> force push · borrar · reset --hard</div>
  </div>
</div></div>
