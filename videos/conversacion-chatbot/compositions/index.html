        /*
         * ------------------------------------------------------------------
         * Conversacion nocturna — la version en video de la pieza que hoy

         */

        /*
         * Archivo (tipografia de marca de ONIA) congelada en el proyecto: el

         * La url es relativa a la pagina ensamblada (la raiz del proyecto).
         */
        @font-face {
          font-family: "Archivo";
          src: url("assets/fonts/Archivo-var-latin.woff2") format("woff2");
          font-weight: 400 700;
          font-style: normal;
          font-display: block;

        /* La raiz se estiliza por #root: el scoper lo trata especial. */
        #root {
          position: absolute;
          inset: 0;
          font-family: "Archivo", "Liberation Sans", Arial, system-ui, sans-serif;
          font-synthesis: weight;
          -webkit-font-smoothing: antialiased;
        }

        .clip {
          position: absolute;
          inset: 0;
        }

        /* --- noche ------------------------------------------------------ */
        /* El relleno a pantalla completa va en un hijo full-bleed, nunca en

           propia raiz y el frame sale negro. */
        .fondo {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(1240px 820px at 50% 45%, #0e1714 0%, #090e0b 58%, #050807 100%);

        .halo {

          height: 1120px;

          background: radial-gradient(

            rgba(2, 118, 80, 0.17),

        /* --- tarjeta ---------------------------------------------------- */
        .marco {

        /* --- cabecera (literal: punto + "WhatsApp del negocio" + 23:47) -- */

        /* Cada fila reserva desde el frame 1 el alto final de su burbuja:

        .fila {

              <div class="hilo">

      <script>
        /*
         * UNA timeline pausada, construida sincronicamente, registrada en
         * window.__timelines["conversacion"]. Determinista: sin relojes, sin
         * Math.random, sin red, sin repeat infinito.
         *
         * En sub-composition las entradas van con fromTo() (from() graba el
         * estado inicial al registrar y se desincroniza al re-seekear).
         *
         * El patron de revelado es el seguro bajo seek: gsap.set(autoAlpha:0)
         * UNA vez al cargar, y despues to(autoAlpha:1) en la entrada. Nunca
         * set(opacity:1) + from(opacity:0): bajo render pausado eso deja el
         * elemento invisible para siempre.
         */
        (function () {
          window.__timelines = window.__timelines || {};

          var CAB = ["#conv-punto", "#conv-quien", "#conv-hora"];
          var OCULTOS = [
            "#conv-tarjeta",
            "#conv-punto",
            "#conv-quien",
            "#conv-hora",
            "#conv-m1",
            "#conv-m2",
            "#conv-m3",
            "#conv-m4",
            "#conv-esc1",
            "#conv-esc2",
          ];

          gsap.set(OCULTOS, { autoAlpha: 0 });

          var tl = gsap.timeline({ paused: true });

          /* ---- beat 0 · 0.00s — la tarjeta llega ---------------------- */
          tl.to("#conv-tarjeta", { autoAlpha: 1, duration: 0.3, ease: "none" }, 0);
          tl.fromTo(
            "#conv-tarjeta",
            { y: 38, scale: 0.976 },
            { y: 0, scale: 1, duration: 0.62, ease: "power3.out" },
            0
          );

          /* ---- beat 0b · 0.26s — cabecera --------------------------- */
          tl.to(CAB, { autoAlpha: 1, duration: 0.24, ease: "none", stagger: 0.05 }, 0.26);
          tl.fromTo(
            CAB,
            { y: -12 },
            { y: 0, duration: 0.38, ease: "power2.out", stagger: 0.05 },
            0.26
          );

          /*
           * Una burbuja aterriza: sube desde abajo y crece desde su propia
           * cola (transform-origin en CSS). Performa y para — nada queda
           * respirando.
           */
          function aterriza(sel, t) {
            tl.to(sel, { autoAlpha: 1, duration: 0.22, ease: "none" }, t);
            tl.fromTo(
              sel,
              { y: 30, scale: 0.94 },
              { y: 0, scale: 1, duration: 0.48, ease: "power3.out" },
              t
            );
          }

          /*
           * Beat de "escribiendo": la pastilla entra donde va a estar la
           * respuesta, los tres puntos rebotan un numero FINITO de veces, y
           * se disuelve justo cuando llega la burbuja.
           * 4 pasadas x 0.16s = 0.64s por punto (yoyo + repeat:3 -> termina
           * en y:0, sin quedar colgado arriba).
           */
          function escribe(pill, puntos, t, tFuera) {
            tl.to(pill, { autoAlpha: 1, duration: 0.16, ease: "none" }, t);
            tl.fromTo(
              pill,
              { y: 16, scale: 0.9 },
              { y: 0, scale: 1, duration: 0.34, ease: "power3.out" },
              t
            );
            tl.to(
              puntos,
              {
                y: -9,
                duration: 0.16,
                ease: "sine.inOut",
                yoyo: true,
                repeat: 3,
                stagger: 0.08,
              },
              t + 0.1
            );
            tl.to(pill, { autoAlpha: 0, duration: 0.16, ease: "none" }, tFuera);
          }

          /* ---- beat 1 · 0.58s — el cliente escribe a las 23:47 ------- */
          aterriza("#conv-m1", 0.58);

          /* ---- beat 2 · 1.24s — Onia esta escribiendo --------------- */
          escribe("#conv-esc1", ["#conv-esc1a", "#conv-esc1b", "#conv-esc1c"], 1.24, 2.14);

          /* ---- beat 3 · 2.14s — Onia contesta ---------------------- */
          aterriza("#conv-m2", 2.14);

          /* ---- beat 4 · 3.40s — el cliente pide reservar ------------ */
          aterriza("#conv-m3", 3.4);

          /* ---- beat 5 · 4.02s — Onia esta escribiendo -------------- */
          escribe("#conv-esc2", ["#conv-esc2a", "#conv-esc2b", "#conv-esc2c"], 4.02, 4.92);

          /* ---- beat 6 · 4.92s — la burbuja que cierra el argumento -- */
          aterriza("#conv-m4", 4.92);

          /* Ultimo tween termina en 5.40s: quedan 1.60s de quietud total
             con la respuesta final legible (el piso pedido era 1.2s). */

          window.__timelines["conversacion"] = tl;
          tl.seek(0);
        })();
      </script>
