<!doctype html>
<meta charset="utf-8">
<title>endcard</title>
<!-- Cierre del video. Paleta del deck (crema + terracota de Claude); el verde de Onia
     entra solo como acento (60-30-10), no como relleno. ?t=<segundos> = un frame. -->
<style>
:root{--bg:#F5F1E8;--ink:#1D1D1F;--muted:#6E6E73;--claude:#D97757;--tile:#EDE7D8;
      --term:#1D1D1F;--term-tx:#F0EDE6;--onia:#00D26A;--naranja:#FF6A2B;--tr:-0.032em}
@font-face{font-family:'Inter';src:url('fonts/Inter-var-latin.woff2')format('woff2');font-weight:100 900;font-display:block}
@font-face{font-family:'Spline Sans Mono';src:url('fonts/SplineSansMono-var-latin.woff2')format('woff2');font-weight:300 700;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink)}
#fondo{position:absolute;inset:0;background:var(--bg)}
#todo{position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:0}
.marcas{display:flex;align-items:center;gap:64px;opacity:0}
.tile{width:132px;height:132px;border-radius:23%;background:var(--tile);overflow:hidden;
      box-shadow:0 18px 36px rgba(0,0,0,.12)}
.tile img{width:100%;height:100%;display:block}
.term{width:170px;height:132px;border-radius:16px;background:var(--term);overflow:hidden;
      box-shadow:0 18px 36px rgba(0,0,0,.18)}
.term .barra{height:34px;display:flex;align-items:center;gap:8px;padding:0 15px;
             border-bottom:1px solid rgba(255,255,255,.1)}
.term .barra i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22)}
.term pre{font-family:'Spline Sans Mono',monospace;font-size:26px;padding:18px 20px 0;
          color:var(--claude);font-weight:700}
h1{margin-top:56px;font-size:112px;font-weight:700;letter-spacing:var(--tr);line-height:1;opacity:0}
h1 .vs{color:var(--naranja);filter:drop-shadow(0 0 18px rgba(255,106,43,.45))}
.linea{height:4px;background:var(--naranja);margin-top:38px;width:0}
.handle{margin-top:44px;font-family:'Spline Sans Mono',monospace;font-size:28px;
        font-weight:500;letter-spacing:.14em;color:var(--muted);opacity:0}
</style>
<div id="fondo"></div>
<div id="todo">
  <div class="marcas">
    <div class="tile"><img src="claude.png" alt=""></div>
    <div class="term"><div class="barra"><i></i><i></i><i></i></div><pre>&gt; _</pre></div>
  </div>
  <h1>Claude <span class="vs">vs</span> Claude Code</h1>
  <div class="linea"></div>
  <div class="handle">@sergiourcullo</div>
</div>
<script>
const t = parseFloat(new URLSearchParams(location.search).get('t') || '0');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const ramp=(a,b)=>clamp((t-a)/(b-a),0,1);
const outExpo=x=>x>=1?1:1-Math.pow(2,-9*x);
const set=(sel,a,b,dy)=>{const e=document.querySelector(sel);const p=outExpo(ramp(a,b));
  e.style.opacity=p.toFixed(4);e.style.transform=`translateY(${((1-p)*dy).toFixed(2)}px)`;};
set('.marcas', 0.25, 0.85, 30);
set('h1',      0.45, 1.10, 26);
set('.handle', 0.95, 1.55, 18);
document.querySelector('.linea').style.width = (outExpo(ramp(0.70,1.45))*380).toFixed(1)+'px';
</script>
