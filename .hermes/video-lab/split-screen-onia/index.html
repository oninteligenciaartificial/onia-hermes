<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0A0F0D;
      }
      body { font-family: "Inter", "Segoe UI", system-ui, sans-serif; }

      /* Las dos mitades ocupan el MISMO plano, superpuestas. El barrido no mueve
         las imagenes: mueve el recorte. Por eso el fondo, la luz y el encuadre
         coinciden cuadro a cuadro, que es lo que vuelve irrefutable la comparacion. */
      .plano { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .plano img {
        position: absolute; inset: 0;
        width: 1080px; height: 1920px;
        object-fit: cover;
      }

      /* ANTES: hundido. Se apaga y se desatura para que el ojo lo lea como el estado viejo. */
      #antes img { filter: saturate(0.55) brightness(0.72) contrast(1.05); }

      /* DESPUES: encima, recortado por el barrido. clip-path se anima en el
         compositor, no toca layout -> no hay reflow durante el render. */
      #despues { clip-path: inset(0 100% 0 0); }

      /* El filo del barrido. Viaja pegado al borde del recorte. */
      #filo {
        position: absolute; top: 0; left: 0;
        width: 6px; height: 1920px;
        background: linear-gradient(180deg, rgba(16,194,107,0) 0%, #10C26B 12%, #10C26B 88%, rgba(16,194,107,0) 100%);
        box-shadow: 0 0 32px 6px rgba(16, 194, 107, 0.55);
      }

      /* JERARQUIA: el ganador mas grande y mas arriba, el perdedor achicado y hundido.
         El ojo decide antes de leer. Fuente: sintesis-lote-17 seccion 5 punto 9. */
      .etiqueta {
        position: absolute;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 14px 26px;
        border-radius: 999px;
        white-space: nowrap;
      }
      #et-antes {
        left: 56px; bottom: 190px;          /* hundido */
        font-size: 30px;                     /* achicado */
        color: #C9D2CD;
        background: rgba(10, 15, 13, 0.72);
        border: 1px solid rgba(201, 210, 205, 0.28);
      }
      #et-despues {
        right: 56px; top: 150px;             /* arriba */
        font-size: 52px;                     /* mas grande */
        color: #0A0F0D;
        background: #10C26B;
        box-shadow: 0 14px 44px rgba(16, 194, 107, 0.42);
      }

      /* Viñeta: hunde los bordes y empuja la mirada al centro del barrido. */
      #vineta {
        position: absolute; inset: 0;
        background: radial-gradient(120% 78% at 50% 46%, rgba(0,0,0,0) 42%, rgba(0,0,0,0.55) 100%);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1080"
      data-height="1920"
    >
      <div class="clip" id="barrido" data-start="0" data-duration="6" data-track-index="0">
        <div class="plano" id="antes">
          <img src="assets/antes.png" alt="Situacion real del negocio, antes" />
        </div>

        <div class="plano" id="despues">
          <img src="assets/despues.png" alt="El mismo plano con ONIA corriendo" />
        </div>

        <div id="filo"></div>
        <div id="vineta"></div>

        <div class="etiqueta" id="et-antes">Hoy</div>
        <div class="etiqueta" id="et-despues">Con Onia</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1. Se respira el "antes" antes de barrer. Sin esta pausa el ojo no
      //    registra el estado viejo y la comparacion no existe.
      tl.from("#et-antes", { opacity: 0, x: -40, duration: 0.5, ease: "power2.out" }, 0.3);

      // 2. El barrido. Un solo movimiento continuo, sin rebote: la comparacion
      //    es un hecho, no un efecto.
      tl.to("#despues", {
        clipPath: "inset(0 0% 0 0)",
        duration: 2.2,
        ease: "power2.inOut",
      }, 1.4);

      tl.to("#filo", {
        x: 1080,
        duration: 2.2,
        ease: "power2.inOut",
      }, 1.4);

      // 3. El filo se apaga al llegar al borde: ya cumplio.
      tl.to("#filo", { opacity: 0, duration: 0.35, ease: "power1.out" }, 3.5);

      // 4. La etiqueta ganadora entra cuando el barrido ya la descubrio.
      tl.from("#et-despues", {
        opacity: 0,
        y: -28,
        scale: 0.9,
        duration: 0.55,
        ease: "back.out(1.6)",
      }, 3.2);

      // 5. El perdedor se hunde un poco mas. Refuerza la jerarquia sin copy.
      tl.to("#et-antes", { opacity: 0.55, duration: 0.6, ease: "power1.out" }, 3.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
