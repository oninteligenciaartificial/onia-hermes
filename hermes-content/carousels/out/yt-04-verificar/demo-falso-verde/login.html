<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>Entrar</title>
<!-- la fuente de iconos: en produccion tardaba 117s y no llegaba a tiempo -->
<link rel="stylesheet" href="https://fonts.example-no-existe.test/icons.css">
<style>
 body{font-family:system-ui;display:grid;place-items:center;height:100vh;margin:0;background:#f7f5f2}
 .caja{background:#fff;padding:48px 56px;border-radius:14px;box-shadow:0 2px 24px #0001;width:380px}
 h1{font-size:26px;margin:0 0 28px}
 label{display:block;font-size:13px;color:#666;margin:16px 0 6px}
 input{width:100%;padding:11px;border:1px solid #ddd;border-radius:7px;font-size:15px;box-sizing:border-box}
 .fila{display:flex;align-items:center;gap:9px;margin-top:22px;font-size:14px;color:#555}
 .material-symbols-outlined{font-family:'Material Symbols Outlined';font-size:21px;color:#2a7}
 button{width:100%;margin-top:26px;padding:13px;background:#1a1a1a;color:#fff;border:0;border-radius:7px;font-size:15px}
</style></head><body>
 <div class="caja">
  <h1>Entrar a tu cuenta</h1>
  <label>Correo</label><input type="email" value="">
  <label>Contraseña</label><input type="password" value="">
  <div class="fila"><span class="material-symbols-outlined">verified_user</span> Conexión protegida</div>
  <div class="fila"><span class="material-symbols-outlined">credit_card_off</span> No pedimos tarjeta</div>
  <button>Entrar</button>
 </div>
</body></html>
