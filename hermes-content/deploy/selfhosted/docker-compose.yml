name: ${COMPOSE_PROJECT_NAME:-onia_selfhosted}

services:
  uptime-kuma:
    profiles: ["monitor"]
    image: ${UPTIME_KUMA_IMAGE:-louislam/uptime-kuma:2}
    restart: unless-stopped
    ports:
      - "${UPTIME_KUMA_BIND:-127.0.0.1}:${UPTIME_KUMA_PORT:-3010}:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - onia_internal
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

  litellm-db:
    profiles: ["ai"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LITELLM_POSTGRES_DB:-litellm}
      POSTGRES_USER: ${LITELLM_POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD:?set LITELLM_POSTGRES_PASSWORD}
    volumes:
      - litellm_pgdata:/var/lib/postgresql/data
    networks:
      - onia_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITELLM_POSTGRES_USER:-litellm} -d ${LITELLM_POSTGRES_DB:-litellm}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true

  litellm:
    profiles: ["ai"]
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm:main-stable}
    restart: unless-stopped
    env_file:
      - ./.env
      - /root/.hermes/.env
    environment:
      DATABASE_URL: postgresql://${LITELLM_POSTGRES_USER:-litellm}:${LITELLM_POSTGRES_PASSWORD:?set LITELLM_POSTGRES_PASSWORD}@litellm-db:5432/${LITELLM_POSTGRES_DB:-litellm}
      STORE_MODEL_IN_DB: "true"
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    ports:
      - "${LITELLM_BIND:-127.0.0.1}:${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    depends_on:
      litellm-db:
        condition: service_healthy
    networks:
      - onia_internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 3072m
    security_opt:
      - no-new-privileges:true

  open-webui:
    profiles: ["ai"]
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:main}
    restart: unless-stopped
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY}
      WEBUI_AUTH: "true"
      WEBUI_URL: ${WEBUI_URL:-}
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
    ports:
      - "${OPEN_WEBUI_BIND:-127.0.0.1}:${OPEN_WEBUI_PORT:-3011}:8080"
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - litellm
    networks:
      - onia_internal
    mem_limit: 2048m
    security_opt:
      - no-new-privileges:true

  stirling-pdf:
    profiles: ["utility"]
    image: ${STIRLING_IMAGE:-stirlingtools/stirling-pdf:latest}
    restart: unless-stopped
    environment:
      SECURITY_ENABLELOGIN: "true"
      SECURITY_INITIALLOGIN_USERNAME: ${STIRLING_INITIALLOGIN_USERNAME:-admin}
      SECURITY_INITIALLOGIN_PASSWORD: ${STIRLING_INITIALLOGIN_PASSWORD:?set STIRLING_INITIALLOGIN_PASSWORD}
      SYSTEM_DEFAULTLOCALE: es-ES
      LANGS: es_ES,en_GB
      SERVER_SERVLET_CONTEXT_PATH: /
      APP_HOME_NAME: ONIA PDF
      APP_HOME_DESCRIPTION: Herramientas PDF internas de ONIA
      APP_NAVBAR_NAME: ONIA PDF
    ports:
      - "${STIRLING_BIND:-127.0.0.1}:${STIRLING_PORT:-3012}:8080"
    volumes:
      - stirling_configs:/configs
      - stirling_logs:/logs
      - stirling_pipeline:/pipeline
    networks:
      - onia_internal
    mem_limit: 2048m
    security_opt:
      - no-new-privileges:true

  crawl4ai:
    profiles: ["research"]
    image: ${CRAWL4AI_IMAGE:-unclecode/crawl4ai:latest}
    restart: unless-stopped
    env_file:
      - /root/.hermes/.env
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
      SECRET_KEY: ${CRAWL4AI_SECRET_KEY:-}
      REDIS_PASSWORD: ${CRAWL4AI_REDIS_PASSWORD:-}
    shm_size: 1gb
    ports:
      - "${CRAWL4AI_BIND:-127.0.0.1}:${CRAWL4AI_PORT:-11235}:11235"
    volumes:
      - crawl4ai_data:/app/data
    networks:
      - onia_internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:11235/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 4096m
    security_opt:
      - no-new-privileges:true

  mailpit:
    profiles: ["mail"]
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.30.2}
    restart: unless-stopped
    ports:
      - "${MAILPIT_BIND:-127.0.0.1}:${MAILPIT_WEB_PORT:-3104}:8025"
      - "${MAILPIT_BIND:-127.0.0.1}:${MAILPIT_SMTP_PORT:-3025}:1025"
    networks:
      - onia_internal
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

  listmonk-db:
    profiles: ["mail"]
    image: ${LISTMONK_POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LISTMONK_POSTGRES_DB:-listmonk}
      POSTGRES_USER: ${LISTMONK_POSTGRES_USER:-listmonk}
      POSTGRES_PASSWORD: ${LISTMONK_POSTGRES_PASSWORD:-}
    volumes:
      - listmonk_pgdata:/var/lib/postgresql/data
    networks:
      - onia_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LISTMONK_POSTGRES_USER:-listmonk} -d ${LISTMONK_POSTGRES_DB:-listmonk}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

  listmonk:
    profiles: ["mail"]
    image: ${LISTMONK_IMAGE:-listmonk/listmonk:v6.1.0}
    restart: unless-stopped
    command:
      - sh
      - -c
      - ./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: listmonk-db
      LISTMONK_db__port: 5432
      LISTMONK_db__user: ${LISTMONK_POSTGRES_USER:-listmonk}
      LISTMONK_db__password: ${LISTMONK_POSTGRES_PASSWORD:-}
      LISTMONK_db__database: ${LISTMONK_POSTGRES_DB:-listmonk}
      LISTMONK_db__ssl_mode: disable
      LISTMONK_db__max_open: 25
      LISTMONK_db__max_idle: 25
      LISTMONK_db__max_lifetime: 300s
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER:-onia-admin}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD:-}
      TZ: ${TZ:-America/La_Paz}
    ports:
      - "${LISTMONK_BIND:-127.0.0.1}:${LISTMONK_PORT:-3105}:9000"
    volumes:
      - listmonk_uploads:/listmonk/uploads
    depends_on:
      listmonk-db:
        condition: service_healthy
    networks:
      - onia_internal
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

  speaches:
    profiles: ["meeting-lite"]
    image: ${SPEACHES_IMAGE:-ghcr.io/speaches-ai/speaches:latest-cpu}
    restart: unless-stopped
    env_file:
      - ./.env
      - /root/.hermes/.env
    ports:
      - "${SPEACHES_BIND:-127.0.0.1}:${SPEACHES_PORT:-3108}:8000"
    volumes:
      - speaches_hf_cache:/home/ubuntu/.cache/huggingface/hub
    networks:
      - onia_internal
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: ${SPEACHES_MEM_LIMIT:-4096m}
    security_opt:
      - no-new-privileges:true

  whisperx-asr:
    profiles: ["meeting-gpu"]
    image: ${WHISPERX_ASR_IMAGE:-learnedmachine/whisperx-asr-service:latest}
    restart: unless-stopped
    env_file:
      - ./.env
      - /root/.hermes/.env
    environment:
      PYTHONWARNINGS: ignore::UserWarning
      DEVICE: ${WHISPERX_DEVICE:-cuda}
      COMPUTE_TYPE: ${WHISPERX_COMPUTE_TYPE:-float16}
      BATCH_SIZE: ${WHISPERX_BATCH_SIZE:-16}
      CACHE_DIR: ${WHISPERX_CACHE_DIR:-/.cache}
      HF_HOME: ${WHISPERX_CACHE_DIR:-/.cache}
      NLTK_DATA: ${WHISPERX_CACHE_DIR:-/.cache}/nltk_data
      PRELOAD_MODEL: ${WHISPERX_PRELOAD_MODEL:-large-v3}
      MAX_FILE_SIZE_MB: ${WHISPERX_MAX_FILE_SIZE_MB:-1000}
      SERVE_MODE: ${WHISPERX_SERVE_MODE:-simple}
      GPU_CONCURRENCY: ${WHISPERX_GPU_CONCURRENCY:-1}
    shm_size: ${WHISPERX_SHM_SIZE:-8g}
    ports:
      - "${WHISPERX_ASR_BIND:-127.0.0.1}:${WHISPERX_ASR_PORT:-3109}:9000"
    volumes:
      - whisperx_cache:/.cache
    networks:
      - onia_internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://127.0.0.1:9000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    mem_limit: ${WHISPERX_ASR_MEM_LIMIT:-12288m}
    security_opt:
      - no-new-privileges:true

  speakr:
    profiles: ["meeting-lite", "meeting-gpu"]
    image: ${SPEAKR_IMAGE:-learnedmachine/speakr:latest}
    restart: unless-stopped
    env_file:
      - ./.env
      - /root/.hermes/.env
    environment:
      LOG_LEVEL: ${SPEAKR_LOG_LEVEL:-ERROR}
      ADMIN_USERNAME: ${SPEAKR_ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${SPEAKR_ADMIN_EMAIL:-admin@onia.local}
      ADMIN_PASSWORD: ${SPEAKR_ADMIN_PASSWORD:?set SPEAKR_ADMIN_PASSWORD}
      SECRET_KEY: ${SPEAKR_SECRET_KEY:?set SPEAKR_SECRET_KEY}
      ALLOW_REGISTRATION: ${SPEAKR_ALLOW_REGISTRATION:-false}
      ENABLE_PUBLIC_SHARING: ${SPEAKR_ENABLE_PUBLIC_SHARING:-false}
      ENABLE_INTERNAL_SHARING: ${SPEAKR_ENABLE_INTERNAL_SHARING:-true}
      ENABLE_SERVER_RECORDING_CHUNKS: ${SPEAKR_ENABLE_SERVER_RECORDING_CHUNKS:-true}
      RECORDING_MAX_HOURS: ${SPEAKR_RECORDING_MAX_HOURS:-8}
      AUDIO_COMPRESS_UPLOADS: ${SPEAKR_AUDIO_COMPRESS_UPLOADS:-true}
      AUDIO_CODEC: ${SPEAKR_AUDIO_CODEC:-mp3}
      AUDIO_BITRATE: ${SPEAKR_AUDIO_BITRATE:-128k}
      TEXT_MODEL_BASE_URL: ${SPEAKR_TEXT_MODEL_BASE_URL:-https://api.openai.com/v1}
      TEXT_MODEL_NAME: ${SPEAKR_TEXT_MODEL_NAME:-gpt-4o-mini}
      TRANSCRIPTION_BASE_URL: ${SPEAKR_TRANSCRIPTION_BASE_URL:-http://speaches:8000/v1}
      TRANSCRIPTION_MODEL: ${SPEAKR_TRANSCRIPTION_MODEL:-Systran/faster-distil-whisper-large-v3}
      TRANSCRIPTION_API_KEY: ${SPEAKR_TRANSCRIPTION_API_KEY:-local}
      ASR_BASE_URL: ${SPEAKR_ASR_BASE_URL:-}
      ASR_DIARIZE: ${SPEAKR_ASR_DIARIZE:-true}
      ASR_MIN_SPEAKERS: ${SPEAKR_ASR_MIN_SPEAKERS:-1}
      ASR_MAX_SPEAKERS: ${SPEAKR_ASR_MAX_SPEAKERS:-5}
      ASR_RETURN_SPEAKER_EMBEDDINGS: ${SPEAKR_ASR_RETURN_SPEAKER_EMBEDDINGS:-true}
      SQLALCHEMY_DATABASE_URI: sqlite:////data/instance/transcriptions.db
      UPLOAD_FOLDER: /data/uploads
      FILE_STORAGE_BACKEND: local
      JOB_QUEUE_WORKERS: ${SPEAKR_JOB_QUEUE_WORKERS:-2}
      SUMMARY_QUEUE_WORKERS: ${SPEAKR_SUMMARY_QUEUE_WORKERS:-2}
    ports:
      - "${SPEAKR_BIND:-127.0.0.1}:${SPEAKR_PORT:-3107}:8899"
    volumes:
      - speakr_uploads:/data/uploads
      - speakr_instance:/data/instance
      - speakr_exports:/data/exports
      - speakr_auto_process:/data/auto-process
    networks:
      - onia_internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8899', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: ${SPEAKR_MEM_LIMIT:-4096m}
    security_opt:
      - no-new-privileges:true

networks:
  onia_internal:
    driver: bridge

volumes:
  uptime_kuma_data:
  litellm_pgdata:
  open_webui_data:
  stirling_configs:
  stirling_logs:
  stirling_pipeline:
  crawl4ai_data:
  listmonk_pgdata:
  listmonk_uploads:
  speaches_hf_cache:
  whisperx_cache:
  speakr_uploads:
  speakr_instance:
  speakr_exports:
  speakr_auto_process:
