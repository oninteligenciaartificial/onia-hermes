<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Antes/Despues — Inmobiliaria (Web Factory)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #0b0f14; font-family: Roboto, "Segoe UI", system-ui, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .bg { position: absolute; inset: 0; }

      /* wireframe gris */
      .wf-page { position: absolute; top: 0; left: 0; width: 1080px; padding: 72px 64px; box-sizing: border-box; }
      .b { background: #d7dce3; border-radius: 12px; }
      .o { border: 3px solid #c6ccd5; border-radius: 16px; box-sizing: border-box; }
      .row { display: flex; gap: 24px; }
      .pill { border-radius: 999px; }

      /* rotulos */
      .cap-wrap { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 150px; box-sizing: border-box; }
      .chip { background: #101418; color: #f2f4f7; font-size: 52px; font-weight: 650; line-height: 1.3;
              padding: 30px 52px; border-radius: 36px; max-width: 880px; text-align: center;
              box-shadow: 0 18px 50px rgba(0,0,0,0.35); }
      .chip small { display: block; font-size: 34px; font-weight: 450; color: #aeb6c0; margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-fovc" id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="17">

      <!-- ANTES: wireframe gris de nuestro diseno -->
      <section data-hf-id="hf-tfln" id="wire" class="clip" data-start="0" data-duration="4.3" data-track-index="1">
        <div data-hf-id="hf-6iln" class="bg" style="background:#eef0f4;"></div>
        <div data-hf-id="hf-h5un" id="wire-page" class="wf-page" data-layout-allow-overflow="">
          <div data-hf-id="hf-80wv" class="wf-block row" style="justify-content:space-between; margin-bottom:56px;">
            <div data-hf-id="hf-vxux" class="b" style="width:300px; height:34px;"></div>
            <div data-hf-id="hf-3ke9" class="b" style="width:120px; height:34px;"></div>
          </div>
          <div data-hf-id="hf-vy0k" class="wf-block b" style="height:460px; margin-bottom:48px; border-radius:20px;"></div>
          <div data-hf-id="hf-xeql" class="wf-block b" style="width:380px; height:22px; margin-bottom:30px;"></div>
          <div data-hf-id="hf-3b33" class="wf-block b" style="width:900px; height:60px; margin-bottom:18px;"></div>
          <div data-hf-id="hf-slvi" class="wf-block b" style="width:800px; height:60px; margin-bottom:18px;"></div>
          <div data-hf-id="hf-p5iq" class="wf-block b" style="width:440px; height:60px; margin-bottom:36px;"></div>
          <div data-hf-id="hf-tfmt" class="wf-block b" style="width:920px; height:20px; margin-bottom:14px;"></div>
          <div data-hf-id="hf-j3hc" class="wf-block b" style="width:700px; height:20px; margin-bottom:44px;"></div>
          <div data-hf-id="hf-i1y3" class="wf-block b pill" style="width:480px; height:88px; margin-bottom:72px;"></div>
          <div data-hf-id="hf-kf1j" class="wf-block b" style="width:520px; height:40px; margin-bottom:36px;"></div>
          <div data-hf-id="hf-53vq" class="wf-block row" style="margin-bottom:24px;">
            <div data-hf-id="hf-4qfq" style="flex:1;">
              <div data-hf-id="hf-37hy" class="b" style="height:260px; margin-bottom:14px;"></div>
              <div data-hf-id="hf-lgn0" class="b" style="width:70%; height:18px; margin-bottom:10px;"></div>
              <div data-hf-id="hf-dlr6" class="b" style="width:45%; height:18px;"></div>
            </div>
            <div data-hf-id="hf-yaii" style="flex:1;">
              <div data-hf-id="hf-82e2" class="b" style="height:260px; margin-bottom:14px;"></div>
              <div data-hf-id="hf-4f78" class="b" style="width:70%; height:18px; margin-bottom:10px;"></div>
              <div data-hf-id="hf-t1dy" class="b" style="width:45%; height:18px;"></div>
            </div>
          </div>
          <div data-hf-id="hf-gc6a" class="wf-block row" style="margin-bottom:64px;">
            <div data-hf-id="hf-yotj" style="flex:1;">
              <div data-hf-id="hf-8gp3" class="b" style="height:260px; margin-bottom:14px;"></div>
              <div data-hf-id="hf-38a5" class="b" style="width:70%; height:18px; margin-bottom:10px;"></div>
              <div data-hf-id="hf-tfoz" class="b" style="width:45%; height:18px;"></div>
            </div>
            <div data-hf-id="hf-z34k" style="flex:1;">
              <div data-hf-id="hf-8v04" class="b" style="height:260px; margin-bottom:14px;"></div>
              <div data-hf-id="hf-3ml6" class="b" style="width:70%; height:18px; margin-bottom:10px;"></div>
              <div data-hf-id="hf-tu00" class="b" style="width:45%; height:18px;"></div>
            </div>
          </div>
          <div data-hf-id="hf-5miv" class="wf-block o" style="height:200px; margin-bottom:40px;"></div>
          <div data-hf-id="hf-kfhl" class="wf-block b pill" style="width:420px; height:80px; margin:0 auto 80px;"></div>
        </div>
      </section>

      <!-- DESPUES: la web real, scroll -->
      <section data-hf-id="hf-tf51" id="web" class="clip" data-start="4.3" data-duration="12.7" data-track-index="2">
        <div data-hf-id="hf-bseo" class="bg" style="background:#0d1e16;"></div>
        <div data-hf-id="hf-nu5b" id="web-page" data-layout-allow-overflow="" style="position:absolute; top:0; left:0; width:1080px;">
          <img data-hf-id="hf-pazn" id="web-img" src="assets/page.png" width="1080" height="14034" style="display:block; width:1080px; height:auto;">
        </div>
      </section>

      <!-- rotulos -->
      <section data-hf-id="hf-vyeu" id="cap-antes" class="clip" data-start="0" data-duration="4.3" data-track-index="3">
        <div data-hf-id="hf-69xp" class="cap-wrap">
          <div data-hf-id="hf-baea" id="cap-antes-inner" class="chip"><small data-hf-id="hf-ledk">Cliente:</small>“necesito una web para mi inmobiliaria”</div>
        </div>
      </section>
      <section data-hf-id="hf-shru" id="cap-despues" class="clip" data-start="4.3" data-duration="12.7" data-track-index="3">
        <div data-hf-id="hf-szcx" class="cap-wrap">
          <div data-hf-id="hf-u2le" id="cap-despues-inner" class="chip">Después:</div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const SPAN = 14034 - 1920; // alto de page.png menos el frame
      const tl = gsap.timeline({ paused: true });

      // ANTES — waterfall de bloques (0–1.2s)
      tl.from(".wf-block", { y: 36, autoAlpha: 0, duration: 0.5, ease: "power2.out", stagger: { each: 0.03 } }, 0.15);
      tl.fromTo("#cap-antes-inner", { y: 60, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "back.out(1.5)" }, 0.8);
      // camara con intencion: recorrer el wireframe hacia abajo (contenido sube)
      tl.to("#wire-page", { y: -420, duration: 1.95, ease: "power1.inOut" }, 1.8);
      // salida acelerando — el corte cae en pleno movimiento (v_fin ~1380 px/s)
      tl.to("#wire-page", { y: "-=380", duration: 0.55, ease: "power2.in" }, 3.75);
      tl.to("#cap-antes-inner", { y: -140, duration: 0.4, ease: "power2.in" }, 3.9);

      // SEAM 4.3s — misma direccion (arriba), entrada en pleno vuelo (v_ini ~1420 px/s)
      tl.fromTo("#web-page", { y: 260 }, { y: 0, duration: 0.55, ease: "power3.out" }, 4.3);
      tl.fromTo("#cap-despues-inner", { y: 90, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power3.out" }, 4.35);
      // quietud breve en el hero, luego el viaje completo hasta el cierre
      tl.to("#web-page", { y: -SPAN, duration: 10.65, ease: "power1.inOut" }, 5.55);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
