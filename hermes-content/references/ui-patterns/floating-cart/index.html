<!-- Patron: carrito flotante de e-commerce. Boton persistente que aparece recien al
     primer "agregar" + modal resumen que NO saca al usuario de la pagina.
     Referencia: https://www.instagram.com/p/DbDjpLuTnKK/ (el video NO da el codigo,
     lo gatea detras de "comment Code": esto esta reconstruido mirando los fotogramas).
     El original es React + Redux Toolkit; aca es HTML/CSS + ~110 lineas de JS.
     Solo animan transform y opacity.
     El modal es un <dialog> nativo: foco atrapado, Escape y devolucion del foco al
     boton los da el navegador, no codigo nuestro. Su altura sale del contenido
     (panel flex con lista scrolleable), no de un truco de inset colapsable. -->

<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <symbol id="fc-lata" viewBox="0 0 48 64">
    <rect x="11" y="7" width="26" height="51" rx="6" fill="currentColor"/>
    <rect x="11" y="7" width="8" height="51" rx="6" fill="#fff" opacity=".26"/>
    <rect x="11" y="27" width="26" height="11" fill="#000" opacity=".16"/>
    <ellipse cx="24" cy="8" rx="13" ry="3.4" fill="#dcdcdc"/>
  </symbol>
</svg>

<div class="fc">
  <p class="fc__eyebrow">Catálogo</p>
  <h2 class="fc__title">Productos populares</h2>
  <ul class="fc__grid" id="fc-grid"></ul>
  <p class="fc__hint">Agregá algo: el botón flotante aparece recién con el primer ítem.</p>
</div>

<button class="fc-fab" id="fc-fab" type="button" inert aria-haspopup="dialog">
  <span class="fc-fab__thumbs" id="fc-fab-thumbs" aria-hidden="true"></span>
  <span class="fc-fab__txt">
    <strong>Ver carrito</strong>
    <small id="fc-fab-sub">0 artículos</small>
  </span>
  <span class="fc-fab__chev" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </span>
</button>

<dialog class="fc-modal" id="fc-modal" aria-labelledby="fc-modal-tit">
  <!-- autofocus manda el foco al panel, no al boton de cerrar, al abrir -->
  <div class="fc-modal__panel" tabindex="-1" autofocus>
    <header class="fc-modal__head">
      <h3 id="fc-modal-tit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2l-2 5v13a2 2 0 002 2h12a2 2 0 002-2V7l-2-5z"/><path d="M4 7h16M15 11a3 3 0 01-6 0"/></svg>
        Tu carrito
        <span class="fc-modal__badge" id="fc-modal-badge">0</span>
      </h3>
      <form method="dialog">
        <button class="fc-modal__x" type="submit" aria-label="Cerrar carrito">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </form>
    </header>

    <ul class="fc-modal__list" id="fc-list"></ul>

    <p class="fc-envio" id="fc-envio" data-estado="checking">
      <span class="fc-envio__txt">Verificando envío gratis</span>
      <span class="fc-envio__brillo" aria-hidden="true"></span>
    </p>

    <div class="fc-modal__sub">
      <span>Subtotal</span>
      <strong id="fc-subtotal">Bs 0,00</strong>
    </div>

    <button class="fc-modal__cta" type="button" id="fc-cta">
      <span>Seguir por WhatsApp</span>
      <span class="fc-modal__cta-fin"><b id="fc-cta-total">Bs 0,00</b>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </span>
    </button>
  </div>
</dialog>

<style>
  .fc, .fc-fab, .fc-modal {
    --carmin: #e11d48;
    --carmin-hondo: #9f1239;
    --rosa: #fde7ec;
    --verde: #10b981;
    --tinta: #1b1a1d;
    --gris: #6d6a72;
    --curva: cubic-bezier(0.16, 1, 0.3, 1);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .fc {
    padding: clamp(24px, 5vw, 44px) clamp(16px, 4vw, 32px) 140px;
    background: #fbfbfc;
    border-radius: 18px;
    color: var(--tinta);
  }
  .fc__eyebrow { margin: 0 0 4px; color: var(--carmin); font-size: .72rem; font-weight: 700; letter-spacing: .16em; }
  .fc__title { margin: 0 0 24px; font-size: clamp(1.4rem, 1.1rem + 1.2vw, 2rem); letter-spacing: -0.02em; }
  .fc__hint { margin: 26px 0 0; color: var(--gris); font-size: .88rem; }

  .fc__grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 18px; margin: 0; padding: 0; list-style: none;
  }

  .fc-card {
    display: flex; flex-direction: column;
    background: #fff; border-radius: 18px; padding: 14px;
    box-shadow: 0 1px 2px rgb(20 18 25 / .06), 0 14px 28px -22px rgb(20 18 25 / .5);
    transition: transform .6s var(--curva), box-shadow .6s var(--curva);
  }
  .fc-card:hover { transform: translateY(-4px); box-shadow: 0 1px 2px rgb(20 18 25 / .06), 0 22px 36px -22px rgb(20 18 25 / .55); }
  .fc-card__img { display: grid; place-items: center; height: 128px; margin-bottom: 12px; }
  .fc-card__img svg { width: 76px; height: 100px; filter: drop-shadow(0 12px 14px rgb(20 18 25 / .22)); }
  .fc-card__cat { color: var(--carmin); font-size: .64rem; font-weight: 700; letter-spacing: .14em; }
  .fc-card__nom { margin: 4px 0 2px; font-size: 1rem; font-weight: 600; }
  .fc-card__voto { color: var(--gris); font-size: .74rem; }
  .fc-card__voto b { color: #f0a500; letter-spacing: -1px; }
  .fc-card__pie { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
  .fc-card__precio { font-size: 1.05rem; font-weight: 700; }

  .fc-add {
    position: relative; display: grid; place-items: center;
    min-width: 96px; height: 34px; padding: 0 14px;
    border: 0; border-radius: 999px; cursor: pointer;
    background: var(--rosa); color: var(--carmin);
    font: inherit; font-size: .82rem; font-weight: 600;
    transition: background-color .5s ease, color .5s ease, transform .5s var(--curva);
  }
  .fc-add:hover { transform: scale(1.05); }
  .fc-add[data-added="true"] { background: var(--verde); color: #fff; }
  /* las dos etiquetas apiladas en la misma celda: nada salta de layout al cambiar */
  .fc-add span {
    grid-area: 1 / 1; display: flex; align-items: center; gap: 6px; white-space: nowrap;
    transition: opacity .35s ease, transform .5s var(--curva);
  }
  .fc-add span svg { width: 14px; height: 14px; }
  .fc-add [data-l="add"] { opacity: 1; }
  .fc-add [data-l="ok"] { opacity: 0; transform: translateY(9px) scale(.9); }
  .fc-add[data-added="true"] [data-l="add"] { opacity: 0; transform: translateY(-9px) scale(.9); }
  .fc-add[data-added="true"] [data-l="ok"] { opacity: 1; transform: none; }

  /* --- boton flotante: existe siempre, pero entra recien con el primer item --- */
  .fc-fab {
    position: fixed; right: clamp(14px, 3vw, 30px); bottom: clamp(14px, 3vw, 30px);
    z-index: 20;
    display: flex; align-items: center; gap: 12px;
    padding: 9px 12px 9px 10px; border: 0; border-radius: 999px; cursor: pointer;
    background: linear-gradient(105deg, var(--carmin), var(--carmin-hondo));
    color: #fff; font: inherit; text-align: left;
    box-shadow: 0 18px 34px -16px rgb(225 29 72 / .75);
    opacity: 0; transform: translateY(150%) scale(.92);
    transition: opacity .5s ease, transform .75s var(--curva);
  }
  .fc-fab[data-visible="true"] { opacity: 1; transform: none; }
  .fc-fab:hover { transform: translateY(-3px); }
  .fc-fab__thumbs { display: flex; }
  .fc-fab__thumbs span {
    display: grid; place-items: center;
    width: 34px; height: 34px; margin-left: -12px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 0 2px var(--carmin-hondo);
    animation: fc-pop .5s var(--curva) backwards;
  }
  .fc-fab__thumbs span:first-child { margin-left: 0; }
  .fc-fab__thumbs svg { width: 15px; height: 20px; }
  @keyframes fc-pop { from { opacity: 0; transform: scale(.4) } }
  .fc-fab__txt { display: grid; line-height: 1.15; }
  .fc-fab__txt strong { font-size: .95rem; }
  .fc-fab__txt small { font-size: .72rem; opacity: .75; }
  .fc-fab__chev { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: rgb(255 255 255 / .18); }
  .fc-fab__chev svg { width: 14px; height: 14px; }

  /* --- modal: <dialog> nativo, anclado abajo a la derecha como en el reel --- */
  .fc-modal {
    margin: auto clamp(14px, 3vw, 30px) clamp(14px, 3vw, 30px) auto;
    width: min(400px, calc(100vw - 28px));
    padding: 0; border: 0; background: transparent; overflow: visible;
    transform-origin: 100% 100%;
    opacity: 0; transform: translateY(28px) scale(.9);
    transition: opacity .5s ease, transform .75s var(--curva),
                overlay .75s allow-discrete, display .75s allow-discrete;
  }
  .fc-modal[open] { opacity: 1; transform: none; }
  /* @starting-style da el estado inicial de la animacion de apertura; sin soporte, entra seco */
  @starting-style { .fc-modal[open] { opacity: 0; transform: translateY(28px) scale(.9); } }
  .fc-modal::backdrop { background: rgb(20 8 14 / .38); opacity: 0; transition: opacity .5s ease, overlay .5s allow-discrete, display .5s allow-discrete; }
  .fc-modal[open]::backdrop { opacity: 1; }
  @starting-style { .fc-modal[open]::backdrop { opacity: 0; } }

  .fc-modal__panel {
    display: flex; flex-direction: column; gap: 12px;
    max-height: min(70vh, 620px);
    padding: 16px; border-radius: 26px;
    background: linear-gradient(150deg, #e8194f, #b3164a);
    color: #fff;
    box-shadow: 0 30px 60px -24px rgb(120 8 40 / .8);
  }
  .fc-modal__panel:focus { outline: none; }
  .fc-modal__head { display: flex; align-items: center; justify-content: space-between; }
  .fc-modal__head h3 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 1.02rem; }
  .fc-modal__head h3 svg { width: 18px; height: 18px; }
  .fc-modal__badge { display: grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: rgb(255 255 255 / .24); font-size: .72rem; }
  .fc-modal__x { display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 50%; background: rgb(255 255 255 / .18); color: #fff; cursor: pointer; transition: transform .45s var(--curva), background-color .3s ease; }
  .fc-modal__x:hover { background: rgb(255 255 255 / .3); transform: rotate(90deg); }
  .fc-modal__x svg { width: 14px; height: 14px; }

  .fc-modal__list { flex: 1; overflow-y: auto; margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .fc-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px; border-radius: 16px; background: rgb(255 255 255 / .13);
    animation: fc-row-in .6s var(--curva) backwards;
  }
  @keyframes fc-row-in { from { opacity: 0; transform: translateY(14px) scale(.96) } }
  .fc-row__img { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 11px; background: #fff; flex: none; }
  .fc-row__img svg { width: 17px; height: 23px; }
  .fc-row__id { flex: 1; min-width: 0; display: grid; line-height: 1.2; }
  .fc-row__cat { font-size: .6rem; letter-spacing: .12em; opacity: .7; }
  .fc-row__nom { font-size: .88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fc-qty { display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 999px; background: rgb(0 0 0 / .18); }
  .fc-qty button {
    width: 22px; height: 22px; border: 0; border-radius: 50%; cursor: pointer;
    background: transparent; color: #fff; font: inherit; font-size: .9rem; line-height: 1;
    transition: background-color .3s ease, transform .4s var(--curva);
  }
  .fc-qty button:hover { background: rgb(255 255 255 / .22); transform: scale(1.12); }
  .fc-qty span { min-width: 16px; text-align: center; font-size: .8rem; font-variant-numeric: tabular-nums; }
  .fc-row__precio { min-width: 68px; text-align: right; font-size: .88rem; font-weight: 700; font-variant-numeric: tabular-nums; }

  .fc-envio {
    position: relative; overflow: hidden;
    margin: 0; padding: 10px 14px; border-radius: 13px;
    background: rgb(255 255 255 / .1); font-size: .78rem;
  }
  .fc-envio[data-estado="ok"] { color: #b9f6d2; }
  .fc-envio__brillo {
    position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 30%, rgb(255 255 255 / .3) 50%, transparent 70%);
    transform: translateX(-100%);
    animation: fc-barrido 1.5s linear infinite;
  }
  @keyframes fc-barrido { to { transform: translateX(100%) } }
  .fc-envio:not([data-estado="checking"]) .fc-envio__brillo { display: none; }

  .fc-modal__sub { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px; }
  .fc-modal__sub span { font-size: .85rem; opacity: .8; }
  .fc-modal__sub strong { font-size: 1.35rem; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .fc-modal__sub strong[data-pop="1"] { animation: fc-pop .45s var(--curva); }

  .fc-modal__cta {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 13px 16px; border: 0; border-radius: 15px; cursor: pointer;
    background: #fff; color: #b3164a; font: inherit; font-size: .92rem; font-weight: 700;
    transition: transform .5s var(--curva);
  }
  .fc-modal__cta:hover { transform: scale(1.02); }
  .fc-modal__cta-fin { display: flex; align-items: center; gap: 4px; opacity: .75; font-weight: 600; }
  .fc-modal__cta-fin svg { width: 15px; height: 15px; }

  @media (prefers-reduced-motion: reduce) {
    .fc-card, .fc-add, .fc-add span, .fc-fab,
    .fc-modal__x, .fc-modal__cta, .fc-qty button { transition-duration: 0.01ms !important; }
    /* el dialog va con transition: none, no con duracion 0: una transicion discreta de
       display/overlay de 0.01ms deja al <dialog> a medio camino (abierto y opacity 0) */
    .fc-modal, .fc-modal::backdrop { transition: none !important; }
    .fc-fab__thumbs span, .fc-row, .fc-envio__brillo, .fc-modal__sub strong { animation: none !important; }
  }
</style>

<script>
  (() => {
    const productos = [
      { id: 'lima',   nom: 'Sipzy Lima',      cat: 'BEBIDA', precio: 28, tono: '#9fce3b', votos: 52,  pts: '4,5' },
      { id: 'cafe',   nom: 'Sipzy Café',      cat: 'BEBIDA', precio: 45, tono: '#3b3227', votos: 159, pts: '4,5' },
      { id: 'menta',  nom: 'Sipzy Menta',     cat: 'BEBIDA', precio: 26, tono: '#4fc3a1', votos: 81,  pts: '4,7' },
      { id: 'maracu', nom: 'Sipzy Maracuyá',  cat: 'BEBIDA', precio: 32, tono: '#f0a63c', votos: 44,  pts: '4,4' }
    ];
    const ENVIO_GRATIS = 120;
    const carrito = new Map();

    const $ = (s) => document.querySelector(s);
    const grid = $('#fc-grid'), fab = $('#fc-fab'), modal = $('#fc-modal');
    const lista = $('#fc-list'), envio = $('#fc-envio'), subtotalEl = $('#fc-subtotal');
    const bs = (n) => 'Bs ' + n.toFixed(2).replace('.', ',');
    const lata = (tono) => `<svg viewBox="0 0 48 64" style="color:${tono}" aria-hidden="true"><use href="#fc-lata"/></svg>`;

    grid.innerHTML = productos.map((p) => `
      <li class="fc-card">
        <div class="fc-card__img">${lata(p.tono)}</div>
        <span class="fc-card__cat">${p.cat}</span>
        <h3 class="fc-card__nom">${p.nom}</h3>
        <span class="fc-card__voto"><b>★★★★★</b> ${p.pts} (${p.votos})</span>
        <div class="fc-card__pie">
          <span class="fc-card__precio">${bs(p.precio)}</span>
          <button class="fc-add" type="button" data-id="${p.id}" data-added="false" aria-label="Agregar ${p.nom} al carrito">
            <span data-l="add" aria-hidden="true">+ Agregar</span>
            <span data-l="ok" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Agregado</span>
          </button>
        </div>
      </li>`).join('');

    const total = () => [...carrito].reduce((s, [id, q]) => s + productos.find((p) => p.id === id).precio * q, 0);
    const unidades = () => [...carrito.values()].reduce((s, q) => s + q, 0);

    let envioTimer;
    function pintar() {
      const n = unidades(), t = total();

      fab.dataset.visible = String(n > 0);
      fab.inert = n === 0;
      $('#fc-fab-sub').textContent = n === 1 ? '1 artículo' : n + ' artículos';
      $('#fc-fab-thumbs').innerHTML = [...carrito.keys()].slice(0, 3)
        .map((id) => `<span>${lata(productos.find((p) => p.id === id).tono)}</span>`).join('');

      $('#fc-modal-badge').textContent = n;
      lista.innerHTML = [...carrito].map(([id, q]) => {
        const p = productos.find((x) => x.id === id);
        return `<li class="fc-row">
          <span class="fc-row__img">${lata(p.tono)}</span>
          <span class="fc-row__id"><span class="fc-row__cat">${p.cat}</span><span class="fc-row__nom">${p.nom}</span></span>
          <span class="fc-qty">
            <button type="button" data-menos="${id}" aria-label="Quitar uno de ${p.nom}">−</button>
            <span>${q}</span>
            <button type="button" data-mas="${id}" aria-label="Sumar uno de ${p.nom}">+</button>
          </span>
          <span class="fc-row__precio">${bs(p.precio * q)}</span>
        </li>`;
      }).join('');

      subtotalEl.textContent = bs(t);
      subtotalEl.dataset.pop = '1';
      setTimeout(() => delete subtotalEl.dataset.pop, 450);
      $('#fc-cta-total').textContent = bs(t);

      // "real time updates": el estado del envio se recalcula en cada cambio
      envio.dataset.estado = 'checking';
      envio.firstElementChild.textContent = 'Verificando envío gratis';
      clearTimeout(envioTimer);
      envioTimer = setTimeout(() => {
        const falta = ENVIO_GRATIS - t;
        envio.dataset.estado = falta <= 0 ? 'ok' : 'falta';
        envio.firstElementChild.textContent = falta <= 0
          ? '✓ Envío gratis desbloqueado'
          : `Te faltan ${bs(falta)} para el envío gratis`;
      }, 900);
    }

    grid.addEventListener('click', (e) => {
      const b = e.target.closest('.fc-add');
      if (!b) return;
      carrito.set(b.dataset.id, (carrito.get(b.dataset.id) || 0) + 1);
      // el verde "Agregado" es un destello de confirmacion, no un estado fijo:
      // vuelve a "+ Agregar" para poder sumar otra unidad (asi se ve en el reel).
      b.dataset.added = 'true';
      clearTimeout(b._t);
      b._t = setTimeout(() => { b.dataset.added = 'false'; }, 1300);
      pintar();
    });

    lista.addEventListener('click', (e) => {
      const mas = e.target.closest('[data-mas]'), menos = e.target.closest('[data-menos]');
      if (mas) carrito.set(mas.dataset.mas, carrito.get(mas.dataset.mas) + 1);
      if (menos) {
        const id = menos.dataset.menos, q = carrito.get(id) - 1;
        q > 0 ? carrito.set(id, q) : carrito.delete(id);
      }
      if (!mas && !menos) return;
      pintar();
      if (!carrito.size) modal.close();
    });

    fab.addEventListener('click', () => modal.showModal());
    // clic afuera: con padding 0 en el <dialog>, solo el backdrop tiene target === modal
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.close(); });
    // Escape, foco atrapado y devolucion del foco los da showModal(). Esto solo cubre el caso
    // en que el foco quedo suelto (ej. el carrito se vacio y el boton flotante paso a inert).
    // Espera a que el dialog salga del top layer: hasta entonces el resto sigue inerte y
    // cualquier .focus() no hace nada.
    modal.addEventListener('close', () => {
      const volverFoco = () => {
        if (modal.open) return;
        if (getComputedStyle(modal).display !== 'none') return setTimeout(volverFoco, 16);
        const act = document.activeElement;
        if (!act || act === document.body || modal.contains(act)) {
          (carrito.size ? fab : grid.querySelector('.fc-add')).focus();
        }
      };
      volverFoco();
    });
    $('#fc-cta').addEventListener('click', (e) => {
      const t = e.currentTarget.firstElementChild;
      t.textContent = 'Abriendo WhatsApp…';
      setTimeout(() => { t.textContent = 'Seguir por WhatsApp'; }, 1600);
    });

    pintar();
  })();
</script>
