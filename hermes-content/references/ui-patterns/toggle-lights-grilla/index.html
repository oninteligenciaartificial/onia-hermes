<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Toggle "Lights" — grilla que se enciende</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; background:#f6f6f7; color:#111; margin:0; padding:24px; }

  .showcase { position:relative; isolation:isolate; padding:24px; border-radius:16px; }

  /* la sala que se apaga: UNA capa, solo opacity */
  .showcase::before {
    content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
    background:#0b0b0f; border-radius:16px; opacity:0;
    transition: opacity 320ms cubic-bezier(.16,1,.3,1);
  }
  .showcase[data-lights="on"]::before { opacity:1; }

  /* el control y la grilla viven ARRIBA de la capa oscura */
  .lights { position:relative; z-index:2; }
  .grid { position:relative; z-index:1; list-style:none; margin:24px 0 0; padding:0;
          display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }

  /* z-index:1 es OBLIGATORIO: crea el stacking context que retiene al halo (z-index:-1).
     Sin esto el halo cae detrás de .showcase::before y NO SE VE. Verificado en Chromium. */
  .card { position:relative; z-index:1; background:#fff; border-radius:12px; padding:16px;
          text-align:center; transition: background 320ms linear, color 320ms linear; }

  /* el halo: gradiente ESTÁTICO, se animan solo opacity + transform */
  .card::after {
    content:""; position:absolute; inset:-20%; z-index:-1; pointer-events:none;
    background: radial-gradient(closest-side, rgb(255 214 138 / .55), transparent 70%);
    opacity:0; transform: scale(.85);
    transition: opacity 320ms linear, transform 320ms cubic-bezier(.16,1,.3,1);
    transition-delay: calc(var(--i,0) * 40ms);   /* barrido, no todo junto */
  }
  .showcase[data-lights="on"] .card::after { opacity:1; transform: scale(1); }

  /* contraste: con la sala apagada los tokens de la card se invierten */
  .showcase[data-lights="on"] .card { background:#15151c; color:#f2ede3; }
  .showcase[data-lights="on"] .thumb { filter: brightness(1.12) saturate(1.05); }

  .thumb { height:80px; border-radius:8px; background:#ffd68a; }

  /* muere el MOVIMIENTO, no el ESTADO */
  @media (prefers-reduced-motion: reduce) {
    .showcase::before, .card, .card::after { transition-duration:1ms; transition-delay:0ms; }
    .card::after { transform:none; }
  }
</style>

<section class="showcase" data-lights="off">
  <button class="lights" type="button" aria-pressed="false" aria-controls="grid">Lights</button>
  <ul id="grid" class="grid">
    <li class="card" style="--i:0"><div class="thumb"></div><p>Lámpara 1</p></li>
    <li class="card" style="--i:1"><div class="thumb"></div><p>Lámpara 2</p></li>
    <li class="card" style="--i:2"><div class="thumb"></div><p>Lámpara 3</p></li>
  </ul>
</section>

<script>
  const s = document.querySelector('.showcase');
  s.querySelector('.lights').addEventListener('click', (e) => {
    const on = s.dataset.lights === 'on';
    s.dataset.lights = on ? 'off' : 'on';
    e.currentTarget.setAttribute('aria-pressed', String(!on));
  });
</script>
