* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; }
#stage { display: inline-block; padding: 22px; background: transparent; }
.tira {
  width: 1000px; background: #0A0F0D; border-radius: 22px; padding: 24px 28px;
  box-shadow: 0 24px 56px rgba(0,0,0,.5);
}
.fila1 {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px;
}
.titulo { display: flex; align-items: center; gap: 12px; }
.pip { width: 8px; height: 28px; border-radius: 3px; }
.titulo span {
  font-size: 30px; letter-spacing: 3px; color: #F4F5F2; text-transform: uppercase;
}
.remate { font-size: 25px; letter-spacing: 2px; text-transform: uppercase; }
.fila2 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.chip {
  display: flex; align-items: center; justify-content: center; gap: 9px;
  border-radius: 14px; padding: 14px 10px; font-size: 24px; white-space: nowrap;
}
.quien { color: #8A8F8C; letter-spacing: 1px; }
.punto { width: 9px; height: 9px; border-radius: 50%; flex: none; }

.chip.bueno { background: rgba(0,210,106,.15); color: #00D26A; }
</style></head><body><div id="stage"><div class="tira">

    <div class="remate" style="color:#00D26A">Todo en un lugar</div>
  </div>
  <div class="fila2">
    <div class="chip bueno">
      <span class="punto" style="background:#00D26A"></span><span class="quien">C1</span>Cotizado
    </div><div class="chip bueno">
      <span class="punto" style="background:#00D26A"></span><span class="quien">C2</span>Agendado
    </div><div class="chip bueno">
      <span class="punto" style="background:#00D26A"></span><span class="quien">C3</span>Esperando
    </div><div class="chip bueno">
      <span class="punto" style="background:#00D26A"></span><span class="quien">C4</span>Cerrado
    </div>
  </div>
</div></div></body></html>
