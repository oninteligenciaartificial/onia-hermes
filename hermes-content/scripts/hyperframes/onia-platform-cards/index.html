<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>ONIA Platform — Tarjetas de micro-animación</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="cards.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Portada del set. Cada tarjeta se renderiza por separado:
         npx hyperframes render . -c compositions/<tarjeta>.html -o renders/<tarjeta>.mp4 */
      #ix-titulo { font-family: var(--font-headline); font-weight: 800; font-size: 62px; margin: 0; }
      #ix-bajada { font-size: 26px; color: var(--on-surface-variant); margin: 18px 0 40px; }
      #ix-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
      #ix-lista li {
        display: flex;
        align-items: center;
        gap: 16px;
        background: var(--surface-container-lowest);
        border: 1px solid rgba(185, 191, 188, 0.5);
        border-radius: 18px;
        padding: 22px 26px;
        font-size: 26px;
      }
      #ix-lista .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--primary); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="indice-tarjetas"
      data-start="0"
      data-width="1080"
      data-height="1080"
      data-duration="3"
      data-fps="30"
    >
      <div class="stage"></div>

      <section id="ix-clip" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <h1 id="ix-titulo">Tarjetas de ONIA Platform</h1>
        <p id="ix-bajada">Micro-animaciones de la interfaz real del producto.</p>
        <ul id="ix-lista">
          <li><span class="dot"></span>Factura emitida · SIAT</li>
          <li><span class="dot"></span>Cobro confirmado · QR</li>
          <li><span class="dot"></span>Alerta del agente · aprobación humana</li>
          <li><span class="dot"></span>Contador de ingresos · delta</li>
        </ul>
      </section>

      <div class="brand"><span class="dot"></span>ONIA Platform</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from('#ix-titulo', { y: 34, opacity: 0, duration: 0.6, ease: 'power3.out' }, 0.1)
        .from('#ix-bajada', { y: 20, opacity: 0, duration: 0.5, ease: 'power2.out' }, 0.28)
        .from('#ix-lista li', { y: 22, opacity: 0, duration: 0.45, ease: 'power2.out', stagger: 0.1 }, 0.45);
      window.__timelines['indice-tarjetas'] = tl;
    </script>
  </body>
</html>
