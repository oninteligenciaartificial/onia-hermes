<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Storyboard UGC IA — ONIA Platform</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1600px; height: 1000px; overflow: hidden; }
    body { background: #f5f1e7; color: #15211c; font-family: Tahoma, sans-serif; padding: 52px 58px; }
    header { display: flex; align-items: end; justify-content: space-between; margin-bottom: 34px; }
    .eyebrow { color: #08734a; font: 700 14px/1 monospace; letter-spacing: 2px; margin-bottom: 12px; }
    h1 { margin: 0; font-size: 48px; line-height: .95; letter-spacing: -2px; }
    header p { margin: 0; width: 440px; color: #526159; font-size: 18px; line-height: 1.4; }
    .frames { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
    figure { margin: 0; min-width: 0; }
    .phone { position: relative; height: 618px; overflow: hidden; border-radius: 24px; background: #e9eee9; border: 1px solid #cad3cd; }
    .phone img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .phone.ui { padding: 20px 12px; background: #eef4f3; display: flex; align-items: center; }
    .phone.ui img { height: auto; max-height: 90%; object-fit: contain; border-radius: 10px; border: 1px solid #cad8d2; }
    .shade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 38%, rgba(4,10,8,.88) 100%); }
    .copy { position: absolute; left: 20px; right: 20px; bottom: 24px; color: #f8f5ed; font-size: 25px; line-height: 1.02; font-weight: 800; letter-spacing: -1px; }
    .copy em { color: #35d695; font-family: Georgia, serif; font-weight: 400; }
    .tag { position: absolute; top: 18px; left: 18px; border-radius: 99px; padding: 9px 12px; background: rgba(9,21,17,.8); color: #f6f3eb; font: 700 12px/1 monospace; letter-spacing: 1px; }
    .product-tag { position: absolute; top: 16px; left: 16px; color: #0a6c49; font: 700 12px/1 monospace; letter-spacing: 1px; }
    .cta { display: inline-block; margin-top: 14px; border-radius: 99px; padding: 12px 16px; background: #35d695; color: #0d1713; font: 800 13px/1 monospace; letter-spacing: .5px; }
    figcaption { padding: 15px 4px 0; color: #5e6e66; font: 700 13px/1.3 monospace; }
    figcaption strong { display: block; color: #08734a; margin-bottom: 6px; }
    footer { display: flex; justify-content: space-between; margin-top: 35px; color: #526159; font: 700 12px/1 monospace; letter-spacing: 1px; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="eyebrow">ONIA PLATFORM · META UGC</div>
      <h1>Presentadora IA.<br>Producto real.</h1>
    </div>
    <p>No es una clienta ni un testimonio. La presentadora abre el dolor; la interfaz de ONIA demuestra el mecanismo.</p>
  </header>

  <main class="frames">
    <figure>
      <div class="phone">
        <img src="assets/ugc-ai-presenter-selfie-v1.png" alt="Presentadora IA en selfie">
        <div class="shade"></div><span class="tag">0–3 S · HOOK</span>
        <div class="copy">¿Cuántos tratamientos quedaron <em>a medias?</em></div>
      </div>
      <figcaption><strong>RECONOCIMIENTO</strong>Pregunta que una clínica puede responder con nombres.</figcaption>
    </figure>

    <figure>
      <div class="phone">
        <img src="assets/ugc-ai-presenter-desk-v1.png" alt="Presentadora IA en escritorio">
        <div class="shade"></div><span class="tag">3–7 S · DOLOR</span>
        <div class="copy">Empezaron.<br><em>Nadie volvió a llamar.</em></div>
      </div>
      <figcaption><strong>CONSECUENCIA</strong>Sin inventar porcentajes ni fingir experiencia personal.</figcaption>
    </figure>

    <figure>
      <div class="phone ui">
        <span class="product-tag">7–13 S · PRODUCTO REAL</span>
        <img src="../../docs/recorrido/capturas/paso-07d-cita-en-agenda.png" alt="Agenda real de ONIA">
      </div>
      <figcaption><strong>AGENDA</strong>Screen recording del tenant demo; nunca UI generada.</figcaption>
    </figure>

    <figure>
      <div class="phone ui">
        <span class="product-tag">13–19 S · DINERO</span>
        <img src="../../docs/recorrido/capturas/paso-08-cobro.png" alt="Cobros reales de ONIA">
      </div>
      <figcaption><strong>COBROS</strong>La demostración sostiene el claim comercial.</figcaption>
    </figure>

    <figure>
      <div class="phone">
        <img src="assets/ugc-ai-presenter-selfie-v1.png" alt="Presentadora IA cierra el anuncio">
        <div class="shade"></div><span class="tag">19–27 S · MECANISMO + CTA</span>
        <div class="copy">Recall prepara.<br><em>Tu equipo decide.</em><br><span class="cta">PROBÁ 14 DÍAS →</span></div>
      </div>
      <figcaption><strong>CIERRE</strong>Una promesa verificable y un solo siguiente paso.</figcaption>
    </figure>
  </main>

  <footer><span>PRESENTADORA SINTÉTICA · NO TESTIMONIO</span><span>BORRADOR DE PRODUCCIÓN · NO PUBLICADO</span></footer>
</body>
</html>
