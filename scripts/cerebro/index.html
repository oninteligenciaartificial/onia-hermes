<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerebro · Onia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
  /* Tokens portados FIEL de references/ui-patterns/dashboard-minimal (direccion "Hoy",
     elegida por Sergio Urcullo 2026-09-17 para el Cerebro). */
  :root {
    --papel: #F9FBFA; --papel-2: #F3F5F4; --blanco: #FFFFFF;
    --tinta: #141A17; --tinta-2: #424A46; --tinta-3: #69716D;
    --linea: #D4D9D6; --linea-suave: #E2E5E3;
    --verde: #027650; --verde-fuerte: #013925; --verde-forma: #00D26A;
    --verde-suave: #D5F4E3; --verde-tenue: #EDFBF3;
    --ambar: oklch(52% 0.11 75); --ambar-suave: oklch(95% 0.045 85);
    --rojo: #ba1a1a; --rojo-suave: #ffdad6;
    --radio: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --papel: #121614; --papel-2: #181D1A; --blanco: #1B211E;
      --tinta: #E6EBE8; --tinta-2: #B9C1BD; --tinta-3: #7F8985;
      --linea: #333B37; --linea-suave: #283029;
      --verde: #4DBD8C; --verde-fuerte: #9BE3C3; --verde-suave: #16382A; --verde-tenue: #14271F;
      --ambar: oklch(80% 0.12 80); --ambar-suave: oklch(30% 0.05 80);
      --rojo: #FF8A80; --rojo-suave: #4A1A18;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--papel); color: var(--tinta);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button:focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; border-radius: 6px; }

  .top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 32px; border-bottom: 1px solid var(--linea-suave); background: var(--papel);
  }
  .marca { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
  .tile { width: 26px; height: 26px; border-radius: 7px; background: var(--verde-forma); display: grid; place-items: center; }
  .tile span { width: 10px; height: 10px; border-radius: 50%; background: #12100E; display: block; }
  .org { color: var(--tinta-3); font-weight: 500; }
  .org::before { content: "·"; margin: 0 8px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--verde-suave); color: var(--verde-fuerte); display: grid; place-items: center; font-size: 12px; font-weight: 700; }

  main { max-width: 1080px; margin: 0 auto; padding: 36px 32px 56px; }

  .saludo { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .saludo h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; margin: 0; text-wrap: balance; }
  .fecha { color: var(--tinta-3); font-size: 14px; margin: 0 0 4px; }
  .resumen { margin: 14px 0 0; font-size: 17px; max-width: 62ch; color: var(--tinta-2); }
  .resumen b { color: var(--tinta); font-weight: 600; }
  .stale { display: none; margin: 14px 0 0; padding: 10px 14px; border-radius: var(--radio);
    background: var(--rojo-suave); color: var(--rojo); font-weight: 600; font-size: 14px; }

  audio { height: 38px; }

  .grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 20px 40px; margin-top: 36px; }
  .col { display: flex; flex-direction: column; gap: 36px; }
  h2 { font-size: 12px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--tinta-3); margin: 0 0 12px; }
  .cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .cab p { margin: 0 0 12px; font-size: 14px; color: var(--tinta-3); }

  /* texto largo (agenda, guiones): sin caja, borde arriba, colapsable */
  .texto { border-top: 1px solid var(--linea-suave); padding-top: 14px;
    white-space: pre-wrap; word-break: break-word; font-size: 14.5px; color: var(--tinta-2); }
  .texto.corto { max-height: 380px; overflow: hidden; position: relative; }
  .texto.corto::after { content: ""; position: absolute; inset: auto 0 0 0; height: 70px;
    background: linear-gradient(transparent, var(--papel)); }
  .vermas { margin-top: 8px; }
  .vacio { color: var(--tinta-3); font-style: italic; border-top: 1px solid var(--linea-suave); padding-top: 14px; }

  .btn { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px;
    border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid var(--linea);
    background: var(--blanco); color: var(--tinta); cursor: pointer; font-family: inherit; }
  .btn:hover { background: var(--papel-2); }

  /* sistema: filas sin cajas, la referencia manda */
  .sistema { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--linea-suave); }
  .sistema li { display: grid; grid-template-columns: 16px 1fr auto; gap: 12px; align-items: baseline;
    padding: 11px 0; border-bottom: 1px solid var(--linea-suave); }
  .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--verde-forma); align-self: center; }
  .punto.ambar { background: var(--ambar); } .punto.rojo { background: var(--rojo); }
  .sistema .q { font-weight: 600; }
  .sistema .d { color: var(--tinta-3); font-size: 13.5px; }
  .aviso { color: var(--ambar); font-weight: 600; font-size: 13.5px; }
  .malo { color: var(--rojo); font-weight: 600; font-size: 13.5px; }

  .decidir { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .decidir li { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center;
    padding: 14px 16px; border-radius: var(--radio); background: var(--blanco); border: 1px solid var(--linea-suave); }
  .decidir .t { font-weight: 600; margin: 0; font-size: 14.5px; }
  .decidir .m { margin: 3px 0 0; font-size: 13px; color: var(--tinta-3); }
  .decidir .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ambar); margin-bottom: 4px; }

  .pie { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--linea-suave);
    color: var(--tinta-3); font-size: 14px; display: flex; gap: 20px; flex-wrap: wrap; }
  .pie b { color: var(--tinta); font-weight: 600; }

  @media (max-width: 860px) {
    .top { padding: 12px 18px; } main { padding: 24px 18px 48px; }
    .grid { grid-template-columns: 1fr; gap: 32px; }
    .saludo h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="marca"><span class="tile"><span></span></span>Onia<span class="org">Cerebro</span></div>
  <span id="hora-top" class="fecha"></span>
  <div class="avatar" aria-label="Sergio Urcullo">SU</div>
</header>

<main>
  <div class="saludo">
    <div>
      <p class="fecha" id="fecha"></p>
      <h1 id="saludo">Cargando…</h1>
    </div>
    <div id="player"></div>
  </div>
  <p class="resumen" id="resumen"></p>
  <p class="stale" id="stale">Los datos no se actualizan: el agregador del VPS no corre desde hace más de 40 minutos.</p>

  <div class="grid">
    <section class="col">
      <div>
        <div class="cab"><h2>Qué tengo hoy</h2><p id="agenda-meta"></p></div>
        <div id="agenda"></div>
      </div>
      <div>
        <div class="cab"><h2>Grabar hoy</h2><p id="video-meta"></p></div>
        <div id="video"></div>
      </div>
    </section>

    <div class="col">
      <section>
        <div class="cab"><h2>Qué me toca decidir</h2><p id="dec-meta"></p></div>
        <div id="decidir"></div>
      </section>
      <section>
        <div class="cab"><h2>Cómo está el sistema</h2><p>medido desde el VPS</p></div>
        <ul class="sistema" id="sistema"></ul>
      </section>
    </div>
  </div>

  <p class="pie" id="pie"></p>
</main>

<script>
const $=(s)=>document.querySelector(s);
const esc=(t)=>String(t??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const mins=(e)=>e?Math.round(Date.now()/1000/60-e/60):null;
const hace=(e)=>{const m=mins(e);return m==null?"sin dato":m<2?"recién":m<90?`hace ${m} min`:`hace ${Math.round(m/60)} h`};
const DIAS=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

function textoLargo(id, obj, vacioMsg){
  const el=$(id);
  if(!obj||!obj.texto){ el.innerHTML=`<p class="vacio">${vacioMsg}</p>`; return; }
  const largo=obj.texto.length>1600;
  el.innerHTML=`<div class="texto ${largo?"corto":""}">${esc(obj.texto)}</div>`+
    (largo?`<button class="btn vermas">Ver completo</button>`:"");
  if(largo) el.querySelector(".vermas").onclick=(e)=>{
    el.querySelector(".texto").classList.remove("corto"); e.target.remove(); };
}

// El id de tarea viaja en la linea del tablero; el boton copia "ok t_xxx" para
// pegarlo en Telegram (el circuito de aprobaciones vive alla, no aca).
function decision(linea){
  const id=(linea.match(/t_[0-9a-f]{8}/)||[])[0];
  const txt=linea.replace(/^[^A-Za-z0-9]*t_[0-9a-f]+\s+\S+\s+\(?\S*\)?\s*/,"").slice(0,120);
  return `<li><div><span class="tag">Bloqueada</span><p class="t">${esc(txt)}</p>
    <p class="m">${id?esc(id)+" · ":""}se responde por Telegram con ok/block</p></div>
    ${id?`<button class="btn" onclick="navigator.clipboard.writeText('ok ${id}')">Copiar «ok»</button>`:""}</li>`;
}

async function pintar(){
  let d;
  try{ d=await (await fetch("data.json?cb="+Date.now())).json(); }
  catch(e){ $("#saludo").textContent="No pude leer data.json"; return; }

  const ahora=new Date();
  $("#fecha").textContent=`${DIAS[ahora.getDay()]} ${ahora.getDate()} de ${MESES[ahora.getMonth()]} · ${String(ahora.getHours()).padStart(2,"0")}:${String(ahora.getMinutes()).padStart(2,"0")}`;
  $("#hora-top").textContent=`actualizado ${hace(d.generado_epoch)}`;
  $("#saludo").textContent=(ahora.getHours()<12?"Buenos días":ahora.getHours()<19?"Buenas tardes":"Buenas noches")+", Sergio";
  $("#stale").style.display=mins(d.generado_epoch)>40?"block":"none";
  if(d.audio_hoy) $("#player").innerHTML=`<audio controls src="resumen-hoy.mp3" title="Resumen narrado de hoy"></audio>`;

  const dec=(d.tablero&&d.tablero.decisiones)||[];
  const loops=((d.loops_casa&&d.loops_casa.loops)||[]);
  const vivos=loops.filter(l=>l.ultimo&&l.ultimo.slice(0,10)===new Date().toISOString().slice(0,10)).length;
  const domOk=((d.dominios&&d.dominios.checks)||[]).every(x=>String(x.resultado||"").startsWith("200"));
  const frenado=((d.publicador&&d.publicador.ultimo_bloque)||[]).some(l=>l.includes("NO publico")||l.includes("FALLO"));

  $("#resumen").innerHTML=
    `${domOk?"La web y la app responden bien.":"<b>Hay algo caído en producción.</b>"} `+
    `Los loops hicieron <b>${vivos} vueltas hoy</b>, `+
    (dec.length?`te esperan <b>${dec.length} decisiones</b>`:"no hay decisiones pendientes")+
    (frenado?` y <b>el publicador está frenado</b> esperando tu firma.`:".");

  // Agenda + guiones
  const a=d.agenda||{}, v=d.video||{};
  $("#agenda-meta").textContent=a.mtime?`escrita ${hace(a.mtime)}${a.de_hoy?"":" — no es de hoy"}`:"";
  textoLargo("#agenda",a.de_hoy?a:{},"El job de las 08:00 todavía no escribió la agenda.");
  $("#video-meta").textContent=v.mtime?`escrito ${hace(v.mtime)}${v.de_hoy?"":" — no es de hoy"}`:"";
  textoLargo("#video",v.de_hoy?v:{},"El job de las 08:10 todavía no escribió los guiones.");

  // Decidir
  $("#dec-meta").textContent=dec.length||"0";
  $("#decidir").innerHTML=dec.length
    ?`<ul class="decidir">${dec.map(decision).join("")}</ul>`
    :`<p class="vacio">Nada espera tu ok. Seguí con tu día.</p>`;

  // Sistema
  const fila=(estado,q,dhtml)=>`<li><span class="punto ${estado}"></span><span class="q">${q}</span><span class="d">${dhtml}</span></li>`;
  const dk=((d.docker&&d.docker.contenedores)||[]);
  const dkMal=dk.filter(x=>x.estado!=="running");
  const hj=((d.hermes&&d.hermes.jobs)||[]);
  const hjMal=hj.filter(j=>j.last_status&&j.last_status!=="ok");
  const rsync=loops[0]?mins(loops[0].rsync_mtime):null;
  let s="";
  s+=fila(domOk?"":"rojo","Producción",domOk?"onia.com.bo y app responden 200":`<span class="malo">algo no responde</span>`);
  s+=fila(dkMal.length?"rojo":"","Contenedores",dkMal.length?`<span class="malo">${esc(dkMal.map(x=>x.contenedor).join(", "))}</span>`:`${dk.length} corriendo`);
  s+=fila(vivos?"":"ambar","Loops de casa",`${vivos} trabajaron hoy · señal ${rsync!=null?(rsync<25?"al día":`vieja (${rsync} min)`):"sin dato"}`);
  s+=fila(hjMal.length?"rojo":"","Hermes",hjMal.length?`<span class="malo">${hjMal.length} job(s) fallando</span>`:`${hj.length} trabajos en verde`);
  s+=fila(frenado?"ambar":"","Publicador",frenado?`<span class="aviso">frenado — espera tu firma de precios</span>`:"publicando solo");
  $("#sistema").innerHTML=s;

  $("#pie").innerHTML=`<span>Datos del VPS, <b>${hace(d.generado_epoch)}</b></span>`+
    `<span>Se refresca solo cada 15 min</span>`+
    `<span>Audio del día: <b>${d.audio_hoy?"listo arriba":"llega 08:25"}</b></span>`;
}
pintar();
setInterval(pintar, 5*60*1000);
</script>
</body>
</html>
