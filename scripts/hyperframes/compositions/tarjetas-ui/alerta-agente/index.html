<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Onia Platform · Tarjeta UI · Alerta del agente</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Tipografia e iconos del PRODUCTO (onia-platform), autohospedados. */
      @font-face {
        font-family: "Manrope";
        src: url("fonts/Manrope-var-latin.woff2") format("woff2");
        font-weight: 200 800;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-var-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Material Symbols Outlined";
        src: url("fonts/material-symbols-outlined.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
        font-family: "Material Symbols Outlined";
        font-weight: normal;
        font-style: normal;
        font-feature-settings: "liga";
        -webkit-font-feature-settings: "liga";
        -webkit-font-smoothing: antialiased;
        line-height: 1;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --primary: #027650;
        --on-primary: #ffffff;
        --primary-container: #d5f4e3;
        --on-primary-container: #013925;
        --verde-50: #edfbf3;
        --verde-300: #86d9b0;
        --surface: #f9fbfa;
        --on-surface: #141a17;
        --on-surface-variant: #424a46;
        --surface-lowest: #ffffff;
        --outline-variant: #b9bfbc;
        --font-headline: "Manrope", sans-serif;
        --font-sans: "Inter", sans-serif;
      }

      html,
      body {
        width: 1080px;
        height: 1080px;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: var(--surface);
        font-family: var(--font-sans);
        color: var(--on-surface);
      }
      .fill {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .glow {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(2, 118, 80, 0.07) 0%, rgba(2, 118, 80, 0) 62%);
      }

      .card {
        position: relative;
        width: 780px;
        border-radius: 28px;
        background: var(--surface-lowest);
        border: 1px solid var(--outline-variant);
        box-shadow: 0 24px 60px rgba(1, 57, 37, 0.1);
        padding: 52px 56px 52px;
        opacity: 0;
      }

      .head {
        display: flex;
        align-items: center;
        gap: 22px;
        opacity: 0;
        visibility: hidden;
      }
      .iconchip {
        width: 84px;
        height: 84px;
        border-radius: 999px;
        background: var(--primary);
        color: var(--on-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .iconchip .material-symbols-outlined {
        font-size: 46px;
      }
      .head h1 {
        font-family: var(--font-headline);
        font-weight: 800;
        font-size: 38px;
        letter-spacing: -0.5px;
      }
      .head .sub {
        margin-top: 4px;
        font-size: 24px;
        color: var(--on-surface-variant);
      }
      .badge {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        height: 52px;
        padding: 0 22px;
        border-radius: 999px;
        background: var(--primary-container);
        color: var(--on-primary-container);
        font-family: var(--font-headline);
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.5px;
      }

      .msg {
        margin-top: 36px;
        font-size: 34px;
        line-height: 1.4;
        color: var(--on-surface);
        opacity: 0;
        visibility: hidden;
      }
      .datos {
        display: flex;
        gap: 16px;
        margin-top: 28px;
        opacity: 0;
        visibility: hidden;
      }
      .dato {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        height: 60px;
        padding: 0 24px;
        border-radius: 14px;
        background: var(--verde-50);
        color: var(--on-primary-container);
        font-weight: 600;
        font-size: 26px;
      }
      .dato .material-symbols-outlined {
        font-size: 32px;
      }

      .botones {
        display: flex;
        gap: 20px;
        margin-top: 40px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        height: 84px;
        padding: 0 40px;
        border-radius: 999px;
        font-family: var(--font-headline);
        font-weight: 700;
        font-size: 30px;
        opacity: 0;
        visibility: hidden;
      }
      .btn .material-symbols-outlined {
        font-size: 34px;
      }
      .btn.filled {
        position: relative;
        overflow: hidden;
        background: var(--primary);
        color: var(--on-primary);
      }
      .btn.outlined {
        border: 2px solid var(--outline-variant);
        color: var(--on-surface-variant);
      }
      /* barrido de foco: un solo pase de luz sobre "Aprobar" */
      .sweep {
        position: absolute;
        top: 0;
        bottom: 0;
        left: -70%;
        width: 55%;
        background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.35) 50%, rgba(255, 255, 255, 0) 100%);
      }

      /* estado de espera: pill + barra de tiempo que corre */
      .espera {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-top: 36px;
        opacity: 0;
        visibility: hidden;
      }
      .espera .material-symbols-outlined {
        font-size: 34px;
        color: var(--on-surface-variant);
      }
      .espera span.txt {
        font-size: 26px;
        color: var(--on-surface-variant);
        white-space: nowrap;
      }
      .waitbar {
        flex: 1;
        height: 8px;
        border-radius: 999px;
        background: var(--verde-50);
        overflow: hidden;
      }
      .waitbar i {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--verde-300);
        transform: scaleX(0);
        transform-origin: left center;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="alerta-agente"
      data-theme="light"
      data-start="0"
      data-duration="5"
      data-fps="30"
      data-width="1080"
      data-height="1080"
    >
      <div id="aa-clip" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div class="fill">
          <div class="glow"></div>
          <div class="card" id="aa-card">
            <div class="head" id="aa-head">
              <div class="iconchip"><span class="material-symbols-outlined">support_agent</span></div>
              <div>
                <h1>Agente Onia</h1>
                <div class="sub">Seguimiento de clientes</div>
              </div>
              <span class="badge">PROPUESTA</span>
            </div>
            <div class="msg" id="aa-msg">
              Detecté <b>3 clientes</b> sin seguimiento hace más de una semana.
              ¿Envío los recordatorios?
            </div>
            <div class="datos" id="aa-datos">
              <span class="dato"><span class="material-symbols-outlined">group</span>3 clientes</span>
              <span class="dato"><span class="material-symbols-outlined">history</span>7 días sin contacto</span>
            </div>
            <div class="botones">
              <div class="btn filled" id="aa-btn-ok">
                <span class="material-symbols-outlined">check</span>
                Aprobar
                <!-- pase de luz: desborda el boton a proposito (lo recorta el
                     overflow:hidden del boton) -->
                <div class="sweep" id="aa-sweep" data-layout-allow-overflow></div>
              </div>
              <div class="btn outlined" id="aa-btn-ver">Ver detalle</div>
            </div>
            <div class="espera" id="aa-espera">
              <span class="material-symbols-outlined">hourglass_top</span>
              <span class="txt">Esperando tu aprobación</span>
              <div class="waitbar"><i id="aa-waitfill"></i></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        // ============================================================
        // Onia Platform · Tarjeta UI · "Alerta del agente" — 5s, 1080x1080.
        // Ruta sostenida: Staged reveals + Sequenced UI life — el agente
        // PROPONE y ESPERA: la alerta llega (desde la derecha), el caso se
        // revela por capas, los botones suben, y el tiempo de espera CORRE
        // (barra) mientras un barrido de foco senala "Aprobar".
        // El agente nunca ejecuta solo: human-in-the-loop.
        // ============================================================
        (function () {
          "use strict";

          function cubicBezier(x1, y1, x2, y2) {
            var cx = 3 * x1,
              bx = 3 * (x2 - x1) - cx,
              ax = 1 - cx - bx;
            var cy = 3 * y1,
              by = 3 * (y2 - y1) - cy,
              ay = 1 - cy - by;
            function sampleX(t) {
              return ((ax * t + bx) * t + cx) * t;
            }
            function sampleY(t) {
              return ((ay * t + by) * t + cy) * t;
            }
            function sampleDX(t) {
              return (3 * ax * t + 2 * bx) * t + cx;
            }
            return function (x) {
              if (x <= 0) return 0;
              if (x >= 1) return 1;
              var t = x,
                i,
                d,
                dx;
              for (i = 0; i < 8; i++) {
                d = sampleX(t) - x;
                if (Math.abs(d) < 1e-7) return sampleY(t);
                dx = sampleDX(t);
                if (Math.abs(dx) < 1e-7) break;
                t -= d / dx;
              }
              var lo = 0,
                hi = 1;
              t = x;
              while (hi - lo > 1e-7) {
                if (sampleX(t) < x) lo = t;
                else hi = t;
                t = (hi + lo) / 2;
              }
              return sampleY(t);
            };
          }
          gsap.registerEase("oniaOutExpo", cubicBezier(0.16, 1, 0.3, 1));
          gsap.registerEase("oniaOutQuart", cubicBezier(0.25, 1, 0.5, 1));

          var card = document.getElementById("aa-card");
          var tl = gsap.timeline({ paused: true });

          // ---- entrada: la alerta LLEGA desde la derecha (vector x) -----------
          tl.fromTo(
            card,
            { opacity: 0, x: 90, scale: 0.98 },
            { opacity: 1, x: 0, scale: 1, duration: 0.6, ease: "oniaOutExpo" },
            0,
          );

          // ---- cascada del caso (waterfall, misma direccion x) ----------------
          var group = ["aa-head", "aa-msg", "aa-datos"];
          var at = 0.15,
            gap = 0.1;
          group.forEach(function (id) {
            var el = document.getElementById(id);
            tl.set(el, { autoAlpha: 1 }, at);
            tl.fromTo(el, { x: 40 }, { x: 0, duration: 0.5, ease: "oniaOutExpo" }, at);
            at += gap;
            gap *= 0.84;
          });

          // ---- botones: suben con stagger corto (1.1s) ------------------------
          var btnOk = document.getElementById("aa-btn-ok");
          var btnVer = document.getElementById("aa-btn-ver");
          [btnOk, btnVer].forEach(function (btn, i) {
            var t0 = 1.1 + i * 0.1;
            tl.set(btn, { autoAlpha: 1 }, t0);
            tl.fromTo(btn, { y: 26 }, { y: 0, duration: 0.45, ease: "oniaOutExpo" }, t0);
          });

          // ---- espera (1.8s): el pedido queda PENDIENTE y el tiempo corre -----
          var espera = document.getElementById("aa-espera");
          var waitfill = document.getElementById("aa-waitfill");
          tl.set(espera, { autoAlpha: 1 }, 1.8);
          tl.fromTo(espera, { x: 30 }, { x: 0, duration: 0.4, ease: "oniaOutExpo" }, 1.8);
          // la barra corre lenta y pareja: es tiempo pasando, no decoracion
          tl.to(waitfill, { scaleX: 1, duration: 2.2, ease: "none" }, 2.0);

          // ---- quietud (2.4-2.75s) y foco: UN barrido sobre "Aprobar" ---------
          var sweep = document.getElementById("aa-sweep");
          tl.fromTo(sweep, { x: 0 }, { x: 560, duration: 0.7, ease: "oniaOutQuart" }, 2.75);
          // el pase termina y la luz se apaga (no queda residuo recortado)
          tl.to(sweep, { autoAlpha: 0, duration: 0.15, ease: "none" }, 3.4);

          // ---- salida (4.4-5.0s): vuelve por la derecha -> loop natural -------
          tl.to(card, { opacity: 0, x: 90, scale: 0.98, duration: 0.45, ease: "oniaOutQuart" }, 4.5);

          window.__timelines = window.__timelines || {};
          window.__timelines["alerta-agente"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
