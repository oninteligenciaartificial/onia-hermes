<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Onia Platform · Tarjeta UI · Factura emitida</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ---- Tipografia del PRODUCTO (onia-platform/app/globals.css) ----------
         Manrope = --font-headline · Inter = --font-sans · Material Symbols =
         los iconos del dashboard. Autohospedadas (woff2 en fonts/) para que el
         frame no dependa de la red ni de la maquina. font-display: block. */
      @font-face {
        font-family: "Manrope";
        src: url("fonts/Manrope-var-latin.woff2") format("woff2");
        font-weight: 200 800;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-var-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Material Symbols Outlined";
        src: url("fonts/material-symbols-outlined.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
        font-family: "Material Symbols Outlined";
        font-weight: normal;
        font-style: normal;
        font-feature-settings: "liga";
        -webkit-font-feature-settings: "liga";
        -webkit-font-smoothing: antialiased;
        line-height: 1;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ---- Tokens del producto (escala verde Onia, superficie M3) ---------- */
      :root {
        --primary: #027650;
        --on-primary: #ffffff;
        --primary-container: #d5f4e3;
        --on-primary-container: #013925;
        --verde-50: #edfbf3;
        --verde-300: #86d9b0;
        --verde-500: #089868;
        --surface: #f9fbfa;
        --on-surface: #141a17;
        --on-surface-variant: #424a46;
        --surface-lowest: #ffffff;
        --outline-variant: #b9bfbc;
        --font-headline: "Manrope", sans-serif;
        --font-sans: "Inter", sans-serif;
      }

      html,
      body {
        width: 1080px;
        height: 1080px;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: var(--surface);
        font-family: var(--font-sans);
        color: var(--on-surface);
      }
      .fill {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* halo verde suave detras de la tarjeta, estatico */
      .glow {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(2, 118, 80, 0.07) 0%, rgba(2, 118, 80, 0) 62%);
      }

      .card {
        position: relative;
        width: 760px;
        border-radius: 28px;
        background: var(--surface-lowest);
        border: 1px solid var(--outline-variant);
        box-shadow: 0 24px 60px rgba(1, 57, 37, 0.1);
        padding: 56px 60px 52px;
        opacity: 0;
      }

      .head {
        display: flex;
        align-items: center;
        gap: 24px;
        opacity: 0;
        visibility: hidden;
      }
      .iconchip {
        width: 88px;
        height: 88px;
        border-radius: 24px;
        background: var(--primary-container);
        color: var(--on-primary-container);
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .iconchip .material-symbols-outlined {
        font-size: 48px;
      }
      .head h1 {
        font-family: var(--font-headline);
        font-weight: 800;
        font-size: 44px;
        letter-spacing: -0.5px;
      }
      .head .sub {
        margin-top: 6px;
        font-size: 26px;
        color: var(--on-surface-variant);
      }

      .rowline {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-top: 40px;
        padding-top: 32px;
        border-top: 1px solid var(--verde-50);
        font-size: 28px;
        color: var(--on-surface-variant);
        opacity: 0;
        visibility: hidden;
      }
      .rowline b {
        color: var(--on-surface);
        font-weight: 600;
      }
      .monto {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 34px;
        opacity: 0;
        visibility: hidden;
      }
      .monto .lbl {
        font-size: 28px;
        color: var(--on-surface-variant);
      }
      .monto .num {
        font-family: var(--font-headline);
        font-weight: 800;
        font-size: 64px;
        letter-spacing: -1px;
      }

      /* estado: pill Emitiendo -> pill Emitida (swap) */
      .estado {
        position: relative;
        margin-top: 44px;
        height: 76px;
      }
      .pill {
        position: absolute;
        left: 0;
        top: 0;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        height: 76px;
        padding: 0 32px;
        border-radius: 999px;
        font-family: var(--font-headline);
        font-weight: 700;
        font-size: 30px;
      }
      .pill .material-symbols-outlined {
        font-size: 36px;
      }
      #fe-pill-emitiendo {
        background: var(--verde-50);
        color: var(--on-primary-container);
        opacity: 0;
        visibility: hidden;
      }
      #fe-pill-emitida {
        background: var(--primary);
        color: var(--on-primary);
        opacity: 0;
        visibility: hidden;
      }
      /* barra de progreso de emision */
      .progress {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 8px;
        border-radius: 0 0 28px 28px;
        overflow: hidden;
        background: var(--verde-50);
        opacity: 0;
        visibility: hidden;
      }
      .progress i {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--primary);
        transform: scaleX(0);
        transform-origin: left center;
      }
      .cuf {
        margin-top: 26px;
        font-size: 24px;
        color: var(--on-surface-variant);
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="factura-emitida"
      data-theme="light"
      data-start="0"
      data-duration="4"
      data-fps="30"
      data-width="1080"
      data-height="1080"
    >
      <div id="fe-clip" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div class="fill">
          <div class="glow"></div>
          <div class="card" id="fe-card">
            <div class="head" id="fe-head">
              <div class="iconchip"><span class="material-symbols-outlined">receipt_long</span></div>
              <div>
                <h1>Factura N.º 0001234</h1>
                <div class="sub">Factura electrónica · Onia Platform</div>
              </div>
            </div>
            <div class="rowline" id="fe-cliente">
              <span>Cliente</span>
              <b>Cliente de muestra</b>
            </div>
            <div class="monto" id="fe-monto">
              <span class="lbl">Total</span>
              <span class="num">Bs 1.250,00</span>
            </div>
            <div class="estado">
              <!-- las dos pills comparten el slot a proposito: una reemplaza a
                   la otra en el swap de estado (overlap transitorio declarado) -->
              <div class="pill" id="fe-pill-emitiendo" data-layout-allow-overlap>
                <span class="material-symbols-outlined">hourglass_top</span>
                Emitiendo…
              </div>
              <div class="pill" id="fe-pill-emitida" data-layout-allow-overlap>
                <span class="material-symbols-outlined">check_circle</span>
                Emitida
              </div>
            </div>
            <div class="cuf" id="fe-cuf">CUF generado · enviada al SIAT</div>
            <div class="progress" id="fe-progress"><i id="fe-progress-fill"></i></div>
          </div>
        </div>
      </div>

      <script>
        // ============================================================
        // Onia Platform · Tarjeta UI · "Factura emitida" — 4s, 1080x1080.
        // Ruta sostenida (motion-doctrine): Sequenced UI life — la factura
        // SE EMITE: entra el documento, corre la emision (barra), pausa
        // dramatica, y el estado cambia a Emitida con impacto.
        // ============================================================
        (function () {
          "use strict";

          function cubicBezier(x1, y1, x2, y2) {
            var cx = 3 * x1,
              bx = 3 * (x2 - x1) - cx,
              ax = 1 - cx - bx;
            var cy = 3 * y1,
              by = 3 * (y2 - y1) - cy,
              ay = 1 - cy - by;
            function sampleX(t) {
              return ((ax * t + bx) * t + cx) * t;
            }
            function sampleY(t) {
              return ((ay * t + by) * t + cy) * t;
            }
            function sampleDX(t) {
              return (3 * ax * t + 2 * bx) * t + cx;
            }
            return function (x) {
              if (x <= 0) return 0;
              if (x >= 1) return 1;
              var t = x,
                i,
                d,
                dx;
              for (i = 0; i < 8; i++) {
                d = sampleX(t) - x;
                if (Math.abs(d) < 1e-7) return sampleY(t);
                dx = sampleDX(t);
                if (Math.abs(dx) < 1e-7) break;
                t -= d / dx;
              }
              var lo = 0,
                hi = 1;
              t = x;
              while (hi - lo > 1e-7) {
                if (sampleX(t) < x) lo = t;
                else hi = t;
                t = (hi + lo) / 2;
              }
              return sampleY(t);
            };
          }
          // misma curva --ease-out-expo de web-factory: es marca
          gsap.registerEase("oniaOutExpo", cubicBezier(0.16, 1, 0.3, 1));
          gsap.registerEase("oniaOutQuart", cubicBezier(0.25, 1, 0.5, 1));

          var card = document.getElementById("fe-card");
          var tl = gsap.timeline({ paused: true });

          // ---- entrada: tarjeta sube (0-0.55s) -------------------------------
          tl.fromTo(
            card,
            { opacity: 0, y: 60, scale: 0.97 },
            { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "oniaOutExpo" },
            0,
          );

          // ---- cascada de contenido (waterfall, cut-the-curve §6):
          //      alpha BINARIA, recorrido en x, huecos que se achican x0.84
          var group = ["fe-head", "fe-cliente", "fe-monto"];
          var at = 0.12,
            gap = 0.1;
          group.forEach(function (id) {
            var el = document.getElementById(id);
            tl.set(el, { autoAlpha: 1 }, at);
            tl.fromTo(el, { x: 34 }, { x: 0, duration: 0.5, ease: "oniaOutExpo" }, at);
            at += gap;
            gap *= 0.84;
          });

          // ---- emision: pill "Emitiendo" + barra que corre (0.6-1.95s) --------
          var pillWait = document.getElementById("fe-pill-emitiendo");
          var progress = document.getElementById("fe-progress");
          var fill = document.getElementById("fe-progress-fill");
          tl.set(pillWait, { autoAlpha: 1 }, 0.6);
          tl.fromTo(pillWait, { x: 24 }, { x: 0, duration: 0.4, ease: "oniaOutExpo" }, 0.6);
          tl.set(progress, { autoAlpha: 1 }, 0.75);
          tl.to(fill, { scaleX: 1, duration: 1.2, ease: "oniaOutQuart" }, 0.75);

          // ---- quietud antes del climax (1.95-2.30s): nada se mueve -----------

          // ---- climax (2.30s): el estado CAMBIA — mismo frame ------------------
          var pillOk = document.getElementById("fe-pill-emitida");
          // la pill de espera se va rapido por el vector de la que llega
          tl.to(pillWait, { autoAlpha: 0, y: -18, duration: 0.22, ease: "oniaOutQuart" }, 2.3);
          // la confirmacion ATERRIZA (escala 1.3 -> 1, llegada con masa)
          tl.fromTo(
            pillOk,
            { autoAlpha: 0, scale: 1.3, y: 10 },
            { autoAlpha: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.5)" },
            2.3,
          );
          // reaccion de la tarjeta al impacto, MISMO frame (masa grande = poco)
          tl.to(card, { y: 4, duration: 0.09, ease: "oniaOutQuart" }, 2.3);
          tl.to(card, { y: 0, duration: 0.28, ease: "oniaOutExpo" }, 2.39);
          // la barra ya cumplio: se apaga con el cambio de estado
          tl.to(progress, { autoAlpha: 0, duration: 0.3, ease: "oniaOutQuart" }, 2.3);

          // ---- revelado escalonado: el frame sigue ganando informacion --------
          var cuf = document.getElementById("fe-cuf");
          tl.set(cuf, { visibility: "visible" }, 2.75);
          tl.fromTo(
            cuf,
            { opacity: 0, x: 24 },
            { opacity: 1, x: 0, duration: 0.4, ease: "oniaOutExpo" },
            2.75,
          );

          // ---- salida (3.5-4.0s): mismo vector de entrada -> loop natural -----
          tl.to(card, { opacity: 0, y: 60, scale: 0.97, duration: 0.42, ease: "oniaOutQuart" }, 3.55);

          window.__timelines = window.__timelines || {};
          window.__timelines["factura-emitida"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
