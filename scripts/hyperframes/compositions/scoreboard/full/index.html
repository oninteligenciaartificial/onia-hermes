<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"eyebrow","type":"string","label":"Antetitulo","default":"155 DÍAS EN PÚBLICO"},
    {"id":"titulo","type":"string","label":"Titulo","default":"LOS 18 OBJETIVOS"},
    {"id":"objetivos","type":"string","label":"Objetivos (JSON)","default":"[{\"cat\":\"FISCAL\",\"obj\":\"Homologación SIAT\",\"meta\":\"antes del 15-sep\",\"hoy\":\"\",\"hecho\":false},{\"cat\":\"NEGOCIO\",\"obj\":\"MRR\",\"meta\":\"USD 5.000\",\"hoy\":\"$0\",\"hecho\":false},{\"cat\":\"CLIENTES\",\"obj\":\"Webs con mensual\",\"meta\":\"10\",\"hoy\":\"0\",\"hecho\":false},{\"cat\":\"TIKTOK\",\"obj\":\"Videos publicados\",\"meta\":\"155\",\"hoy\":\"0\",\"hecho\":true}]"},
    {"id":"accent","type":"color","label":"Acento","default":"#00D26A"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>ONIA · Scoreboard full (los 18 objetivos)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Tipografia de marca autohospedada — mismo contrato que las otras dos
         variantes del scoreboard: cada composicion lleva su propio fonts/ porque
         HyperFrames sirve la carpeta de la composicion como raiz y rechaza "../". */
      @font-face {
        font-family: "Bricolage Grotesque";
        src: url("fonts/BricolageGrotesque-var-latin.woff2") format("woff2");
        font-weight: 500 700;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "DM Sans";
        src: url("fonts/DMSans-var-latin.woff2") format("woff2");
        font-weight: 400 500;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Spline Sans Mono";
        src: url("fonts/SplineSansMono-var-latin.woff2") format("woff2");
        font-weight: 400 500;
        font-style: normal;
        font-display: block;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        --stage-w: 1920;
        --stage-h: 1080;
        --u: calc(var(--stage-w) / 1000 * 1px);
        --accent: #00d26a;
        --accent-ink: var(--accent);
        --ink: #0a0c11;
        --ink2: #15181f;
        --ink-text: #f6f8fb;
        --muted: rgba(246, 248, 251, 0.62);
        --muted2: rgba(246, 248, 251, 0.42);
        --hairline: rgba(255, 255, 255, 0.11);
        --track: rgba(255, 255, 255, 0.14);
        --gloss: rgba(255, 255, 255, 0.09);
        --shadow:
          0 calc(var(--u) * 26) calc(var(--u) * 60) calc(var(--u) * -16) rgba(0, 0, 0, 0.7),
          0 calc(var(--u) * 7) calc(var(--u) * 18) rgba(0, 0, 0, 0.38);
        --wipe: 100;
        --font-display: "Bricolage Grotesque", sans-serif;
        --font-body: "DM Sans", sans-serif;
        --font-mono: "Spline Sans Mono", monospace;
        font-family: var(--font-body);
      }
      #stage[data-theme="light"] {
        --ink: #ffffff;
        --ink2: #f4f5f7;
        --ink-text: #0b0d12;
        --muted: rgba(11, 13, 18, 0.62);
        --muted2: rgba(11, 13, 18, 0.42);
        --hairline: rgba(11, 13, 18, 0.12);
        --track: rgba(11, 13, 18, 0.14);
        --gloss: rgba(255, 255, 255, 0.85);
        --accent-ink: color-mix(in srgb, var(--accent) 62%, #000000);
      }

      .fill {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(var(--u) * 26);
      }

      /* La placa es OPACA (misma decision que el marcador chico): a media
         transparencia el contraste del texto depende del plano de atras. */
      .plate {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: calc(var(--u) * 14);
        background: linear-gradient(180deg, var(--ink2) 0%, var(--ink) 62%);
        border: 1px solid var(--hairline);
        box-shadow: var(--shadow);
        padding: calc(var(--u) * 26) calc(var(--u) * 30) calc(var(--u) * 22);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .gloss {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gloss), transparent);
      }

      /* ---- cabecera ---- */
      .head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: calc(var(--u) * 20);
        padding-bottom: calc(var(--u) * 12);
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 7);
        font-family: var(--font-body);
        font-weight: 500;
        font-size: calc(var(--u) * 11);
        letter-spacing: calc(var(--u) * 1.7);
        color: var(--muted);
        text-transform: uppercase;
      }
      .eyebrow i {
        width: calc(var(--u) * 7);
        height: calc(var(--u) * 7);
        border-radius: 50%;
        background: var(--accent);
        display: block;
      }
      h1 {
        margin: calc(var(--u) * 5) 0 0;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: calc(var(--u) * 33);
        line-height: 1;
        letter-spacing: calc(var(--u) * -0.6);
        color: var(--ink-text);
      }
      .prog {
        text-align: right;
        min-width: calc(var(--u) * 210);
      }
      .prog-k {
        font-size: calc(var(--u) * 10.5);
        letter-spacing: calc(var(--u) * 1.5);
        color: var(--muted);
        text-transform: uppercase;
      }
      .prog-n {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: calc(var(--u) * 30);
        line-height: 1.06;
        color: var(--ink-text);
        font-variant-numeric: tabular-nums;
      }
      .prog-n span {
        color: var(--muted);
        font-size: calc(var(--u) * 20);
      }
      /* La barra ES el acento: relleno solido, revelado por clip-path (nada de
         degradado — con el wipe lo visible es siempre el tramo izquierdo). */
      .track {
        margin-top: calc(var(--u) * 8);
        height: calc(var(--u) * 5);
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
      }
      .track-fill {
        height: 100%;
        background: var(--accent);
        clip-path: inset(0 calc(var(--wipe) * 1%) 0 0);
      }

      .rule {
        height: 1px;
        background: var(--hairline);
        margin: calc(var(--u) * 10) 0 calc(var(--u) * 12);
      }

      /* ---- tabla: dos columnas de nueve ---- */
      .cols {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 calc(var(--u) * 26);
      }
      .col {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }
      .row {
        display: grid;
        grid-template-columns: calc(var(--u) * 22) 1fr auto calc(var(--u) * 62);
        align-items: center;
        gap: calc(var(--u) * 10);
        padding: calc(var(--u) * 7.5) 0;
        border-bottom: 1px solid var(--hairline);
      }
      .col .row:last-child {
        border-bottom: 0;
      }
      .n {
        font-family: var(--font-mono);
        /* WCAG AA: con --muted2 (0.42 alpha) daba 3.94:1 y el gate lo rechaza.
           La jerarquia contra .meta la da el TAMANO, no una opacidad ilegible. */
        font-size: calc(var(--u) * 10);
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .obj {
        min-width: 0;
      }
      .cat {
        font-size: calc(var(--u) * 8.6);
        letter-spacing: calc(var(--u) * 1.35);
        color: var(--accent-ink);
        text-transform: uppercase;
        font-weight: 500;
      }
      .txt {
        font-size: calc(var(--u) * 14);
        line-height: 1.16;
        color: var(--ink-text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .meta {
        font-family: var(--font-mono);
        font-size: calc(var(--u) * 11);
        color: var(--muted);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .hoy {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        font-family: var(--font-mono);
        font-size: calc(var(--u) * 14);
        color: var(--ink-text);
        font-variant-numeric: tabular-nums;
      }
      /* Casilla dibujada en CSS. Nada de emoji: las fuentes de marca son subset
         latin y un ⬜/✅ saldria tofu (misma trampa que el ≈ en el marcador chico). */
      .box {
        width: calc(var(--u) * 15);
        height: calc(var(--u) * 15);
        border-radius: calc(var(--u) * 3.5);
        border: calc(var(--u) * 1.6) solid var(--muted);
        position: relative;
      }
      .box.on {
        border-color: var(--accent);
        background: var(--accent);
      }
      .box.on::after {
        content: "";
        position: absolute;
        left: 32%;
        top: 14%;
        width: 26%;
        height: 52%;
        border-right: calc(var(--u) * 2.2) solid var(--ink);
        border-bottom: calc(var(--u) * 2.2) solid var(--ink);
        transform: rotate(42deg);
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="scoreboard-full"
      data-theme="dark"
      data-start="0"
      data-duration="8"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="sf-clip" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div class="fill">
          <div class="plate" id="sf-plate">
            <div class="gloss"></div>

            <div class="head">
              <div>
                <div class="eyebrow" id="sf-eyebrow"><i></i><span></span></div>
                <h1 id="sf-title">LOS 18 OBJETIVOS</h1>
              </div>
              <div class="prog">
                <div class="prog-k">PROGRESO</div>
                <div class="prog-n"><span id="sf-done">0</span><span id="sf-total"> / 18</span></div>
              </div>
            </div>
            <div class="track"><div class="track-fill"></div></div>

            <div class="rule"></div>

            <div class="cols">
              <div class="col" id="sf-col-a"></div>
              <div class="col" id="sf-col-b"></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          // Solver de bezier unitaria: la MISMA curva de marca que el resto de las
          // composiciones (--ease-out-expo de web-factory). Aproximar con power4.out
          // moveria la marca.
          function cubicBezier(x1, y1, x2, y2) {
            var A = function (a, b) {
              return 1 - 3 * b + 3 * a;
            };
            var B = function (a, b) {
              return 3 * b - 6 * a;
            };
            var C = function (a) {
              return 3 * a;
            };
            var sampleX = function (t) {
              return ((A(x1, x2) * t + B(x1, x2)) * t + C(x1)) * t;
            };
            var sampleY = function (t) {
              return ((A(y1, y2) * t + B(y1, y2)) * t + C(y1)) * t;
            };
            var slopeX = function (t) {
              return 3 * A(x1, x2) * t * t + 2 * B(x1, x2) * t + C(x1);
            };
            return function (x) {
              if (x <= 0) return 0;
              if (x >= 1) return 1;
              var t = x;
              for (var i = 0; i < 8; i++) {
                var d = sampleX(t) - x;
                var dx = slopeX(t);
                if (Math.abs(dx) < 1e-7) break;
                t -= d / dx;
              }
              var lo = 0,
                hi = 1;
              t = x;
              while (hi - lo > 1e-7) {
                if (sampleX(t) < x) lo = t;
                else hi = t;
                t = (hi + lo) / 2;
              }
              return sampleY(t);
            };
          }
          gsap.registerEase("oniaOutExpo", cubicBezier(0.16, 1, 0.3, 1));
          gsap.registerEase("oniaOutQuart", cubicBezier(0.25, 1, 0.5, 1));

          var stage = document.getElementById("stage");
          var FPS = Number(stage.dataset.fps) || 30;
          var DUR = Number(stage.dataset.duration) || 8;
          var TOTAL = Math.max(1, Math.round(DUR * FPS));
          document.getElementById("sf-clip").dataset.duration = String(DUR);

          // La salida se ancla al FINAL: alargar --duration alarga el SOSTEN.
          function enterExit(o) {
            o = o || {};
            var delay = o.delayFrames || 0;
            var enterF = Math.max(1, Math.round(((o.enterMs || 320) / 1000) * FPS));
            var exitF = Math.max(1, Math.round(((o.exitMs || 240) / 1000) * FPS));
            var exitStart = Math.max(delay + enterF, TOTAL - exitF);
            return {
              enterAt: delay / FPS,
              enterDur: enterF / FPS,
              exitAt: exitStart / FPS,
              exitDur: Math.max(1, TOTAL - exitStart) / FPS,
            };
          }

          function readVars() {
            var decls = [];
            try {
              decls = JSON.parse(document.documentElement.dataset.compositionVariables || "[]");
            } catch (e) {
              decls = [];
            }
            var out = {};
            for (var i = 0; i < decls.length; i++) out[decls[i].id] = decls[i].default;
            var live =
              window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                ? window.__hyperframes.getVariables()
                : null;
            if (live) {
              for (var k in out) {
                if (live[k] !== undefined && live[k] !== null) out[k] = live[k];
              }
            }
            return out;
          }

          var V = readVars();
          var eyebrow = String(V.eyebrow || "");
          var elEyebrow = document.getElementById("sf-eyebrow");
          elEyebrow.querySelector("span").textContent = eyebrow;
          if (!eyebrow) elEyebrow.hidden = true;
          document.getElementById("sf-title").textContent = String(V.titulo || "");

          // La tabla viaja como JSON en una variable (las variables de HyperFrames
          // son strings). Si viene rota, la placa se dibuja vacia en vez de reventar.
          var filas = [];
          try {
            var parsed = typeof V.objetivos === "string" ? JSON.parse(V.objetivos) : V.objetivos;
            if (Array.isArray(parsed)) filas = parsed;
          } catch (e) {
            filas = [];
          }

          var colA = document.getElementById("sf-col-a");
          var colB = document.getElementById("sf-col-b");
          var mitad = Math.ceil(filas.length / 2);
          var nodos = [];

          function texto(el, cls, valor) {
            var d = document.createElement("div");
            d.className = cls;
            d.textContent = valor;
            el.appendChild(d);
            return d;
          }

          for (var i = 0; i < filas.length; i++) {
            var f = filas[i] || {};
            var row = document.createElement("div");
            row.className = "row";

            texto(row, "n", String(i + 1).padStart(2, "0"));

            var obj = document.createElement("div");
            obj.className = "obj";
            texto(obj, "cat", String(f.cat || ""));
            texto(obj, "txt", String(f.obj || ""));
            row.appendChild(obj);

            texto(row, "meta", String(f.meta || ""));

            var hoy = document.createElement("div");
            hoy.className = "hoy";
            var valorHoy = String(f.hoy == null ? "" : f.hoy).trim();
            if (valorHoy) {
              hoy.textContent = valorHoy;
            } else {
              // objetivo binario: casilla, no numero
              var box = document.createElement("div");
              box.className = "box" + (f.hecho ? " on" : "");
              hoy.appendChild(box);
            }
            row.appendChild(hoy);

            (i < mitad ? colA : colB).appendChild(row);
            nodos.push(row);
          }

          var hechos = 0;
          for (var j = 0; j < filas.length; j++) if (filas[j] && filas[j].hecho) hechos++;
          var totalObj = filas.length || 18;
          var ratio = totalObj ? hechos / totalObj : 0;
          document.getElementById("sf-total").textContent = " / " + totalObj;

          // ---- timeline -------------------------------------------------------
          var tl = gsap.timeline({ paused: true });

          // La placa entra desde abajo y sale por el mismo camino (vector law).
          var plate = enterExit({ enterMs: 320, exitMs: 240 });
          var PLATE_Y = "calc(var(--u) * 12)";
          var elPlate = document.getElementById("sf-plate");
          tl.fromTo(
            elPlate,
            { opacity: 0, y: PLATE_Y },
            { opacity: 1, y: 0, duration: plate.enterDur, ease: "oniaOutExpo" },
            plate.enterAt,
          );
          tl.to(
            elPlate,
            { opacity: 0, y: PLATE_Y, duration: plate.exitDur, ease: "oniaOutQuart" },
            plate.exitAt,
          );

          // Barra + contador: UN solo gesto atado al mismo progreso (700ms), igual
          // que el marcador chico. Con 0 de 18 la barra queda en cero: correcto,
          // el dia que haya avance se llena sola.
          var boot = { p: 0 };
          var elDone = document.getElementById("sf-done");
          tl.to(
            boot,
            {
              p: 1,
              duration: Math.max(1, Math.round((700 / 1000) * FPS)) / FPS,
              ease: "oniaOutExpo",
              onUpdate: function () {
                stage.style.setProperty("--wipe", 100 - ratio * boot.p * 100);
                elDone.textContent = String(Math.round(hechos * boot.p));
              },
            },
            4 / FPS,
          );

          // Waterfall entry (cut-the-curve §6): eje Y DESDE ABAJO (el default del
          // catalogo), opacidad BINARIA por tl.set (nunca fade), una sola direccion
          // y huecos que SE ACHICAN.
          //
          // La cascada se estira a proposito (~1.3s): son 18 filas para LEER al
          // final del episodio, no un titulo. Ademas el gate de layout falla con
          // sweep_static cuando el reveal muere en el primer segundo y el resto de
          // la pieza queda congelada — "spread the reveal across the timeline".
          var fila = enterExit({ delayFrames: 5, enterMs: 300, exitMs: 220 });
          var ROW_Y = "calc(var(--u) * 10)";
          var at = fila.enterAt;
          var gap = 4 / FPS;
          for (var k = 0; k < nodos.length; k++) {
            gsap.set(nodos[k], { autoAlpha: 0 });
            tl.set(nodos[k], { autoAlpha: 1 }, at);
            tl.fromTo(
              nodos[k],
              { y: ROW_Y },
              { y: 0, duration: fila.enterDur, ease: "oniaOutExpo" },
              at,
            );
            tl.to(
              nodos[k],
              { autoAlpha: 0, y: ROW_Y, duration: fila.exitDur, ease: "oniaOutQuart" },
              fila.exitAt,
            );
            at += gap;
            gap *= 0.92;
          }

          window.__timelines = window.__timelines || {};
          window.__timelines["scoreboard-full"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
