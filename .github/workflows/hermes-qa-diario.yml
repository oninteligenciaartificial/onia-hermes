name: Hermes QA — diagnóstico diario del VPS

# POR QUÉ EXISTE (10-oct, HERMES_ROL_QA.md Q2). Hermes pasó a ser el QA de Onia y el turno de noche,
# y la sesión de la nube lee el VPS por los logs de Actions, nunca por SSH. Hasta hoy el diagnóstico
# corría solo a mano: con la PC apagada nadie veía el VPS. Esto lo corre una vez por día.
#
#   - Corre SOLO diagnostico.sh, que solo lee: crontab, logs, latidos, Hermes, n8n, tablero.
#     `aplicar` y `revertir` siguen siendo manuales, en hermes-jarvis.yml («nunca por horario»
#     vale para ellos).
#   - Sin inputs: nada que llegue de afuera elige qué se corre.
#   - El mismo runner propio del VPS (no gasta minutos de Actions), pero su PROPIO grupo de
#     `concurrency`. Compartir el de hermes-jarvis.yml parecía más prolijo, pero GitHub deja un solo
#     pendiente por grupo: el QA de las 10:00 cancelaba un `revertir` que esperaba detrás de un
#     `aplicar` (revisión del 10-oct). Una lectura a la vez que un `aplicar` no rompe nada; un
#     `revertir` cancelado en una emergencia, sí.
#   - Solo desde main: a mano también se puede correr, pero no desde otra rama (un diagnostico.sh
#     cambiado en una rama correría como root en el VPS).
#   - Toda salida se redacta dos veces (en el VPS y acá) antes de quedar en el log.

on:
  schedule:
    - cron: "0 10 * * *" # 06:00 La Paz, antes del resumen de las 06:30
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hermes-qa-diario
  cancel-in-progress: false

jobs:
  vps:
    name: diagnostico diario en el VPS
    runs-on: [self-hosted, linux, onia-vps]
    timeout-minutes: 15
    steps:
      - name: Checkout (solo la carpeta de hermes-jarvis)
        uses: actions/checkout@v4
        with:
          sparse-checkout: hermes-content/deploy/hermes-jarvis
          sparse-checkout-cone-mode: false
          filter: blob:none
          # En el runner del VPS no queda el token de GitHub en el .git: este trabajo no lo usa.
          persist-credentials: false

      - name: Solo desde main
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "el QA diario corre solo desde main (pediste $GITHUB_REF)"; exit 1; }

      - name: Llave SSH del VPS
        env:
          KEY: ${{ secrets.ONIA_VPS_SSH_KEY }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/vps_key"
          chmod 600 "$RUNNER_TEMP/vps_key"

      - name: Ejecutar diagnostico (24 h)
        env:
          VPS: "root@187.77.16.63"
        run: |
          set -o pipefail
          DIR=hermes-content/deploy/hermes-jarvis
          {
            printf 'REDACTAR_SED=%q\n' "$(cat "$DIR/redactar.sed")"
            printf 'COMMIT=%q\nHORAS=%q\n' "$GITHUB_SHA" 24
            cat "$DIR/comun.sh"
            cat "$DIR/diagnostico.sh"
          } | ssh -i "$RUNNER_TEMP/vps_key" -o StrictHostKeyChecking=no -o BatchMode=yes \
                -o ServerAliveInterval=30 "$VPS" 'bash -s' 2>&1 \
            | sed -E -f "$DIR/redactar.sed" | tee "$RUNNER_TEMP/diagnostico.log"
          # El diagnóstico sale 0 aunque haya vigías mudos: el job quedaba verde con el crontab callado (revisión del
          # 16-oct, E36). Si la línea de la sección «latidos» cuenta una o más MUDA(S), el job falla y GitHub avisa.
          if grep -Eq -- '^--- [0-9]+ línea\(s\): [1-9][0-9]* MUDA\(S\)' "$RUNNER_TEMP/diagnostico.log"; then
            echo "::error::hay vigías MUDOS en el crontab del VPS (ver la sección latidos)"
            exit 1
          fi

      - name: Borrar la llave
        if: always()
        run: rm -f "$RUNNER_TEMP/vps_key"
