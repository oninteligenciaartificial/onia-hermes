name: Hermes Jarvis — pruebas del carril

# POR QUÉ EXISTE (2026-10-02). La sesión madre pidió que lo de Hermes (aduana, resumen y cierre,
# calendario, pedidos a Claude, aplicar/revertir) llegue a main con la suite verde en Linux y en
# un CI, no solo en la sesión que lo escribió. Hasta hoy ningún workflow corría en los PRs.
#
#   - Corre en los runners de GitHub, NUNCA en el runner propio del VPS: el código de un PR no se
#     ejecuta en producción.
#   - Solo lee el repo (permissions: contents: read) y no usa ningún secreto.
#   - Checkout parcial: el árbol entero pesa GB y estas pruebas usan ~80 MB.
#   - `test:guards-cableados` queda afuera: revisa la estructura de TODO el repo (pide carpetas como
#     web-factory) y se corre local, con el árbol completo.

on:
  pull_request:
    paths:
      - "scripts/loops/**"
      - "scripts/herramientas-*"
      - "scripts/onia-mirar.js"
      - "scripts/git-autosync.js"
      - ".claude/settings.json"
      - ".gitignore"
      - "hermes-content/deploy/hermes-jarvis/**"
      - "hermes-content/deploy/hermes-agent/**"
      - "hermes-content/skills/agenda-calendario.md"
      - "hermes-content/skills/pedir-a-claude.md"
      - "hermes-content/skills/planificar-orquesta.md"
      - "scripts/orquesta/**"
      - ".claude/skills/onia-hermes-jarvis/scripts/**"
      - ".github/workflows/hermes-*.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hermes-jarvis-pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: suite del carril hermes-jarvis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout (solo lo que usan las pruebas)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            hermes-content/deploy
            hermes-content/skills
            hermes-content/docs
            .claude
            .github
            .gitignore
            package.json
          sparse-checkout-cone-mode: false
          filter: blob:none
          # El token de GitHub no queda en .git/config: las pruebas no lo necesitan (revisión de la
          # madre, 2-oct). Las actions van por versión mayor, no por SHA: fijar el SHA exige leer el
          # repo de cada action, fuera del alcance de las sesiones del carril.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pruebas
        run: |
          set -o pipefail
          fallas=0
          for s in test:pedidos test:orquesta-hermes test:jarvis-aplicar test:jarvis-diagnostico test:qa-diario-guarda test:jarvis-modelo test:jarvis-qa-release test:web-vs-producto test:jarvis-resumen test:aduana test:agenda test:qa-release \
                   test:herramientas-desplegadas test:herramientas-del-cron test:docs-hygiene; do
            echo "::group::$s"
            if npm run -s "$s"; then echo "✅ $s"; else echo "::error::$s en rojo"; fallas=$((fallas + 1)); fi
            echo "::endgroup::"
          done
          [ "$fallas" -eq 0 ]
