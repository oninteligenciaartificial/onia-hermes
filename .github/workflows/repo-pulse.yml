name: Repo Pulse

# Genera un resumen diario de actividad del repo (commits por carril, tipos,
# carriles sin actividad reciente) y lo sube al VPS para que los bots de n8n
# (Briefing diario + Reporte Sergio/Arthur) lo lean con un simple `cat`. El
# checkout de Actions ya tiene git + todas las ramas, asi que no hace falta
# ningun token nuevo: reusa el mismo ONIA_VPS_SSH_KEY del deploy.

on:
  schedule:
    - cron: "0 10 * * *" # 06:00 America/La_Paz (UTC-4), antes del Briefing 06:45
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: repo-pulse
  cancel-in-progress: true

jobs:
  pulse:
    name: Compute + deliver repo pulse
    # Runner PROPIO en el VPS (onia-runner-hermes, 0,5 CPU / 1,5 GB): no gasta la
    # cuota Free de Actions, agotada el 2026-09-27. Montaje y ROLLBACK:
    # hermes-content/deploy/vps-ops/gh-runner/instalar.sh (volver a ubuntu-latest).
    runs-on: [self-hosted, linux, onia-vps]
    timeout-minutes: 10
    steps:
      - name: Checkout (historial completo, todas las ramas)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # El historial completo pesa ~11 GB (videos, capturas). En el runner del
          # VPS el clon persiste en disco: se traen commits y arboles (lo que
          # `git log --all` y `git show --name-only` usan), sin blobs.
          filter: blob:none
          # Y del arbol solo el guion: el HEAD pesa 6,2 GB y en un runner propio
          # queda en el disco del VPS. Medido el 28-sep: sin esto, 11 GB.
          sparse-checkout: scripts/repo-pulse.mjs
          sparse-checkout-cone-mode: false

      - name: Fetch de todas las ramas remotas
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Calcular repo pulse
        run: node scripts/repo-pulse.mjs > repo-pulse.json

      - name: Escribir llave SSH del VPS
        env:
          KEY: ${{ secrets.ONIA_VPS_SSH_KEY }}
        run: |
          printf '%s\n' "$KEY" > $RUNNER_TEMP/vps_key
          chmod 600 $RUNNER_TEMP/vps_key

      - name: Subir al VPS
        env:
          VPS_HOST: "187.77.16.63"
          VPS_USER: "root"
        run: |
          ssh -i $RUNNER_TEMP/vps_key -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "mkdir -p /opt/onia/state"
          scp -i $RUNNER_TEMP/vps_key -o StrictHostKeyChecking=no repo-pulse.json "$VPS_USER@$VPS_HOST:/opt/onia/state/repo-pulse-latest.json"
