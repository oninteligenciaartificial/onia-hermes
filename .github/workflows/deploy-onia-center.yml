name: Deploy ONIA Center

# Buildea el standalone en ubuntu (NO en el VPS: swap 100%; NO en Windows: sharp
# nativo) y deploya por SSH. Publica DOS cosas seguidas: center.onia.com.bo y,
# despues, onia.com.bo (el sitio de venta).
#
# SOLO MANUAL desde el 2026-08-31 (workflow_dispatch). Antes disparaba con cada push
# a main que tocara web-factory/**, y eso resulto ser una trampa cara:
#
#   El paso de center murio y el paso del landing NUNCA corrio. onia.com.bo — el sitio
#   que ve un cliente — quedo sin publicar desde el 22-ago, con 77 commits acumulados,
#   sin que nada de su app estuviera roto. Se lo llevo puesto el vecino.
#
#   Y el primer fallo (24-ago) ni siquiera fue el lockfile: el deploy de center
#   FUNCIONO (DEPLOY_OK, login 200) y el job murio despues, en el paso cosmetico
#   [6/6] maintenance dry-run, con "Broken pipe" -> exit 255 bajo set -e.
#
# Ademas center.onia.com.bo esta BAJADO a proposito desde el 29-ago (Sergio saco sus
# routers de traefik). Seguir auto-publicandolo es publicar una superficie sin ruta.
#
# ⚠️ El contenedor onia-center NO se apaga: el auditor diario lo usa como runtime de
# node (docker exec onia-center node). Bajar el deploy y bajar el servicio son cosas
# distintas.
#
# Para publicar: workflow_dispatch con swap=false (build+stage, no toca produccion) y,
# si sale verde, otra corrida con swap=true. Volver al deploy automatico exige decidir
# antes que hacer con el paso de center — sacarlo, o arreglarlo.

on:
  workflow_dispatch:
    inputs:
      swap:
        description: "Promover a produccion (swap). false = solo build + stage."
        type: choice
        default: "true"
        options: ["true", "false"]

permissions:
  contents: read

concurrency:
  group: deploy-onia-center
  cancel-in-progress: false

jobs:
  deploy:
    name: Build (ubuntu) + deploy (SSH) ONIA Center
    # Queda en ubuntu-latest a proposito: buildea Next y su cabecera explica por que NO en el VPS.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # deploy-vivo.test.ts (prebuild de onia-platform) mide merges en una
          # ventana de git; con el checkout superficial "git no contesta" y el
          # gate falla. Medido el 2026-09-17 (run 35273222431).
          fetch-depth: 0
          # …pero el historial COMPLETO de este repo pesa 11 GB (videos, capturas,
          # renders) y el runner se quedó sin disco dos veces el 2026-09-18 (runs
          # 35387801812 y 35388443587: "No space left on device" al segundo
          # build). Clone parcial: todos los commits y árboles (lo que `git log
          # --name-only` necesita), los blobs sólo del HEAD.
          filter: blob:none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - name: Write VPS SSH key
        env:
          KEY: ${{ secrets.ONIA_VPS_SSH_KEY }}
        run: |
          printf '%s\n' "$KEY" > /tmp/vps_key
          chmod 600 /tmp/vps_key

      - name: Deploy
        env:
          VPS_HOST: "187.77.16.63"
          VPS_USER: "root"
          VPS_KEY: "/tmp/vps_key"
          DEPLOY_SWAP: ${{ github.event_name == 'push' && 'true' || inputs.swap }}
          DEPLOY_REF: ${{ github.sha }}
        run: bash scripts/deploy-onia-center.sh

      - name: Deploy landing (onia.com.bo)
        env:
          VPS_HOST: "187.77.16.63"
          VPS_USER: "root"
          VPS_KEY: "/tmp/vps_key"
          DEPLOY_SWAP: ${{ github.event_name == 'push' && 'true' || inputs.swap }}
          DEPLOY_REF: ${{ github.sha }}
        run: bash scripts/deploy-onia-landing.sh

      - name: Notify Sergio (Telegram)
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_SERGIO_CHAT_ID }}
          STATUS: ${{ job.status }}
          EVENT: ${{ github.event_name }}
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          MSG="Deploy ONIA Center [$STATUS] commit $SHORT ($EVENT). https://center.onia.com.bo/onia-center"
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -s -m 15 -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              -d chat_id="$TG_CHAT" --data-urlencode text="$MSG" >/dev/null || true
          fi
