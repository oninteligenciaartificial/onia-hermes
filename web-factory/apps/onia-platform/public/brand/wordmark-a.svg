<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 164" role="img" aria-label="onia">
  <title>onia — wordmark A: led</title>
  <desc>Minuscula geometrica monolinea. El punto de la i es un cuadrado verde: un modulo encendido.</desc>
  <style>
    .ink { stroke: #141A17; }
    .led { fill: #089868; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #ECEFED; }
