<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 318 116" role="img" aria-label="onia">
  <title>onia — candidato D "la ia encendida" (lockup)</title>
  <desc>Wordmark "onia" en bloques solidos pesados (sello, no monolinea) con el dos-tonos del logo original de Sergio reinterpretado: "on" en tinta + "ia" en verde #3EA639 — la ia es la parte encendida del sistema. Punto de la i cuadrado (el modulo). Propuesta paralela al v1, 2026-07-26. Verde autocontenido, no token de UI (ONIA_BRAND_IDENTITY_2026.md §1.4).</desc>
  <style>
    .ink { fill: #141A17; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #ECEFED; }
    }
  </style>
  <!-- o (tinta) : anillo solido R36, pared 22 -->
  <path class="ink" fill-rule="evenodd" d="M72 72 A36 36 0 1 1 0 72 A36 36 0 1 1 72 72 Z M50 72 A14 14 0 1 0 22 72 A14 14 0 1 0 50 72 Z"/>
  <!-- n (tinta) : arco solido, astas planas en la base -->
  <path class="ink" d="M96 108 V70 A34 34 0 0 1 164 70 V108 H142 V70 A12 12 0 0 0 118 70 V108 Z"/>
  <!-- i (verde) : asta + punto cuadrado — el modulo encendido -->
  <rect x="188" y="36" width="22" height="72" rx="5" fill="#3EA639"/>
  <rect x="188" y="0" width="22" height="22" rx="5" fill="#3EA639"/>
  <!-- a (verde) : anillo + asta fusionada -->
  <path fill-rule="evenodd" d="M306 72 A36 36 0 1 1 234 72 A36 36 0 1 1 306 72 Z M292 72 A14 14 0 1 0 264 72 A14 14 0 1 0 292 72 Z" fill="#3EA639"/>
  <rect x="296" y="36" width="22" height="72" rx="5" fill="#3EA639"/>
</svg>
