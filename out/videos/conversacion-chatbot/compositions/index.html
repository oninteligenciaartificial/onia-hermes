<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="probe" data-start="0" data-duration="7" data-width="1920" data-height="1080">
      <div id="probe-a" class="clip" data-start="0" data-duration="7" data-track-index="0">x</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to("#probe-a", { opacity: 1, duration: 1 }, 0);
      window.__timelines["probe"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
