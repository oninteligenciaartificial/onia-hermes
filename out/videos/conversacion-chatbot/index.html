<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Conversacion nocturna — 23:47</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /*
       * Archivo — la tipografia de marca de ONIA (globals.css: --font-display y
       * --font-sans apuntan las dos a Archivo). El .woff2 esta CONGELADO en
       * assets/fonts/ para que el render no dependa de la red.
       *
       * El @font-face vive aca, en el <head> del host, y no dentro del
       * <template> del sub-composition: el head del host SI es el head de la
       * pagina que se renderiza, asi que la cara queda registrada una vez para
       * toda la pagina ensamblada.
       */
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/Archivo-var-latin.woff2") format("woff2");
        font-weight: 400 700;
        font-style: normal;
        font-display: block;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        /* piso opaco: evita el flash blanco en el primer frame */
        background: #080c0a;
      }

      /*
       * El host NO se llama #root: ese id lo necesita la raiz del
       * sub-composition (el scoper de CSS lo trata especial). Dos #root en la
       * pagina ensamblada seria un id duplicado.
       */
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #080c0a;
      }

      .clip {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="main"
      data-start="0"
      data-duration="7"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <!--
        Una sola ranura a pantalla completa. data-composition-id del host ==
        data-composition-id interno del archivo == la clave de
        window.__timelines dentro de el ("conversacion").
      -->
      <div
        id="slot-conversacion"
        class="clip"
        data-composition-id="conversacion"
        data-composition-src="compositions/index.html"
        data-start="0"
        data-duration="7"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
