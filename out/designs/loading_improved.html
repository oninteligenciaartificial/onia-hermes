<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Onia — Loading (Mejorado)</title>
  <style>
    :root{
      --bg:#0f1724; /* dark app bg like screenshot */
      --card:#0b1220;
      --muted:#9aa4b2;
      --accent:#00D26A; /* Onia green */
      --skeleton:#1b2430;
      --skeleton-2:#17202a;
      --glass: rgba(255,255,255,0.02);
      --radius:12px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color:#e6eef6;
    }
    html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#09101a);} 
    .viewport{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
    .frame{width:100%;max-width:1100px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(2,6,23,0.6);}

    /* top header */
    .header{display:flex;align-items:center;gap:16px}
    .logo-sq{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#00b85a);display:flex;align-items:center;justify-content:center;font-weight:700;color:#05110a}
    .title{flex:1}
    .title h1{margin:0;font-size:18px}
    .title p{margin:2px 0 0;color:var(--muted);font-size:13px}

    /* progress / microcopy */
    .progress-wrap{margin-top:18px;display:flex;align-items:center;gap:12px}
    .progress{height:8px;background:var(--skeleton);border-radius:999px;flex:1;overflow:hidden;position:relative}
    .progress > i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#00ffa2);border-radius:999px;transition:width 480ms linear}
    .micro{color:var(--muted);font-size:13px;width:320px}

    /* skeleton content */
    .content{display:grid;grid-template-columns:260px 1fr;gap:20px;margin-top:20px}
    .left{min-height:260px;background:var(--card);padding:16px;border-radius:12px}
    .skeleton{background:linear-gradient(90deg,var(--skeleton),var(--skeleton-2),var(--skeleton));background-size:200% 100%;animation:shimmer 1.6s linear infinite;border-radius:8px}
    .avatar{width:48px;height:48px;border-radius:8px;background:var(--skeleton)}
    .line{height:12px;border-radius:8px;margin:10px 0;background:var(--skeleton)}
    .card{padding:14px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));border-radius:12px}

    .list .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.02)}
    .row .thumb{width:46px;height:46px;border-radius:8px;background:var(--skeleton)}
    .row .meta{flex:1}
    .row .meta .mline{height:10px;width:80%;background:var(--skeleton);border-radius:6px}

    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

    /* small utilities */
    .button{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.03);color:var(--accent);border:1px solid rgba(0,210,106,0.12);cursor:pointer}
    .muted{color:var(--muted)}

    /* responsive */
    @media (max-width:760px){.content{grid-template-columns:1fr;}.micro{width:100%}}
  </style>
</head>
<body>
  <div class="viewport">
    <div class="frame">
      <div class="header">
        <div class="logo-sq">ON</div>
        <div class="title">
          <h1>Onia — Cargando tu espacio</h1>
          <p class="muted">Estamos preparando tu vista. Esto se hace solo una vez por sesión.</p>
        </div>
        <div><button class="button" id="open-light">Abrir versión ligera</button></div>
      </div>

      <div class="progress-wrap">
        <div class="progress" aria-hidden="true"><i id="bar"></i></div>
        <div class="micro" id="micro">Sincronizando tus citas y mensajes…</div>
      </div>

      <div class="content">
        <div class="left card">
          <div style="display:flex;align-items:center;gap:12px">
            <div class="avatar"></div>
            <div style="flex:1">
              <div class="line" style="width:70%"></div>
              <div class="line" style="width:40%;height:10px;margin-top:8px"></div>
            </div>
          </div>

          <div style="height:14px"></div>
          <div class="skeleton" style="height:120px;border-radius:10px"></div>
          <div style="height:12px"></div>
          <div class="muted" style="font-size:13px">Consejo: Si la carga se demora más de 7s, intenta abrir la versión ligera.</div>
        </div>

        <div>
          <div class="card">
            <div style="display:flex;align-items:center;gap:14px;margin-bottom:6px"><div class="skeleton" style="width:160px;height:18px;border-radius:6px"></div><div class="muted" style="font-size:12px">Actualizado: ahora</div></div>
            <div style="height:8px"></div>
            <div class="list">
              <div class="row"><div class="thumb"></div><div class="meta"><div class="mline"></div></div></div>
              <div class="row"><div class="thumb"></div><div class="meta"><div class="mline" style="width:60%"></div></div></div>
              <div class="row"><div class="thumb"></div><div class="meta"><div class="mline" style="width:50%"></div></div></div>
            </div>
          </div>

          <div style="height:14px"></div>
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center"><div class="muted">Conexiones</div><div class="muted">Estado</div></div>
            <div style="height:10px"></div>
            <div style="display:flex;gap:10px"><div class="skeleton" style="width:120px;height:18px;border-radius:8px"></div><div class="skeleton" style="width:80px;height:18px;border-radius:8px"></div></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const bar = document.getElementById('bar');
    const micro = document.getElementById('micro');
    const openLight = document.getElementById('open-light');

    // Simulated progressive steps (for demo)
    const steps = [
      {w:6, text:'Cargando componentes UI…'},
      {w:28, text:'Sincronizando agenda…'},
      {w:52, text:'Trayendo conversaciones…'},
      {w:72, text:'Verificando integraciones…'},
      {w:92, text:'Finalizando sincronz'},
      {w:100, text:'Listo. Redirigiendo…'}
    ];

    let i = 0;
    function tick(){
      if(i >= steps.length) return;
      const step = steps[i++];
      bar.style.width = step.w + '%';
      micro.textContent = step.text.replace('\u001a','');
      // next tick variable delay
      const delay = 800 + Math.random()*900;
      setTimeout(()=>{
        if(i<steps.length) tick(); else setTimeout(()=>{micro.textContent = 'Carga completada.';},300);
      },delay);
    }
    setTimeout(tick,400);

    openLight.addEventListener('click', ()=>{
      // Simulate opening a lightweight shell immediately
      micro.textContent = 'Abriendo versin ligera…';
      bar.style.width='100%';
      setTimeout(()=>{micro.textContent='Versi\u00f3n ligera abierta.'},800);
    });
  </script>
</body>
</html>
